    section: 4.3 计算阵列（engine_pix）
  rules:
  - find: "        assign ram_we[p] = !rst && (fill_write ||\n            (pixel_write && !bad_keep && !ws_data[32*p+31]) || ras_we_vec[p]);"
    replace: '        assign ram_we[p] = !rst && (fill_write || (pixel_write && !bad_keep) || ras_we_vec[p]); // 注错：bit31 不写标记失效'
  runs:
  - cmd: python3 Main/tools/check/check_g2_band.py
    log: Main/sim/engine/band/logs
    evidence: ''
  note: 注错：bit31 不写标记失效
