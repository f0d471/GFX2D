- id: blend.copy_dst
  target: Main/rtl/engine/core/engine_blend.v
  macro: INJ_COPY_DST
  defect: 输入依赖
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.5 像素流水线
  rules:
  - find: "            3'd0: begin // COPY     Fs=255 Fd=0\n\n                sel_base = {1'b0, src};"
    replace: "            3'd0: begin // COPY     Fs=255 Fd=0\n\n                sel_base = {1'b0, src} + {1'b0, dst};"
  runs:
  - cmd: bash Main/sim/engine/blend/run.sh --case narrow_copy
    log: Main/sim/engine/blend/build
    evidence: 'MISMATCH #\d+: eq=0 '
  note: COPY 的 Fd 是 0，目的像素不得进入结果；只有让不用的输入变化，这条约束才看得出
- id: blend.trunc16
  target: Main/rtl/engine/core/engine_blend.v
  macro: INJ_TRUNC16
  defect: 位宽截断
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.5 像素流水线
  rules:
  - find: '    wire [17:0] t      = t_full;'
    replace: '    wire [17:0] t      = {2''b00, t_full[15:0]};'
  runs:
  - cmd: bash Main/sim/engine/blend/run.sh --case narrow_trunc
    log: Main/sim/engine/blend/build
    evidence: 'MISMATCH #\d+: eq=2 '
  note: t 模截断到 16 位会丢进位，规格写明中间量不得截断
- id: blend.unreg_c
  target: Main/rtl/engine/core/engine_blend.v
  macro: INJ_UNREG_C
  defect: 流水对齐
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.5 像素流水线
  rules:
  - find: '    wire signed [17:0] c_stage = $signed(r_c);  // c255 恒正（<= 130050 < 2^17，第 17 位为 0），按 18 位有符号给进 DSP 的 C 口。'
    replace: '    wire signed [17:0] c_stage = $signed(c255_comb);'
  runs:
  - cmd: bash Main/sim/engine/blend/run.sh --case narrow_unreg
    log: Main/sim/engine/blend/build
    evidence: 'MISMATCH #\d+: eq=1 '
  note: 级 2 必须用级 1 寄存的 base×255，否则两拍的操作数被相加
- id: blend.wrong_eq
  target: Main/rtl/engine/core/engine_blend.v
  macro: INJ_WRONG_EQ
  defect: 运算恒等
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.5 像素流水线
  rules:
  - find: "            3'd3: begin // CONST    Fs=c   Fd=255-c\n\n                sel_base = {1'b0, dst};\n                sel_m1   = $signed({1'b0, src}) - $signed({1'b0, dst});"
    replace: "            3'd3: begin // CONST    Fs=c   Fd=255-c\n\n                sel_base = {1'b0, src};\n                sel_m1   = $signed({1'b0, dst}) - $signed({1'b0, src});"
  runs:
  - cmd: bash Main/sim/engine/blend/run.sh --case narrow_const
    log: Main/sim/engine/blend/build
    evidence: 'MISMATCH #\d+: eq=3 '
  note: CONST 的 base 与 m1 同时取错后 base×255+m1×m2 不再恒等于规格算式
- id: blend.x_no_en
  target: Main/rtl/engine/core/engine_blend.v
  macro: INJ_X_NO_EN
  defect: 停顿时序
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.5 像素流水线
  rules:
  - find: '        if (en) r_x <= x_comb;'
    replace: '        r_x <= x_comb;'
  runs:
  - cmd: bash Main/sim/engine/blend/run.sh --case stall
    log: Main/sim/engine/blend/build
    evidence: 'MISMATCH #\d+: eq='
  note: 停顿期间级 2 不得推进；同一份源码在 exhaustive 上 PASS，只有插停顿拍才见红
