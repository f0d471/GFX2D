- id: display_fetch.swap_now
  target: Main/rtl/display/display_fetch.v
  macro: INJ_SWAP_NOW
  defect: 切换与排空
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.7 双缓冲与帧节拍
  rules:
  - find: "\n            // SWAP_REQ 的请求位：软件写它（写 0 撤销），场起始那一刻锁存并清零"
    replace: "            // 注错 SWAP_NOW：写请求立刻切换，不等场起始（会切出撕裂帧）\n            if (swap_write) begin\n                base_eff   <= back_sh;\n                front_base <= back_sh;\n                swap_count <= swap_count + 32'h1;\n            end\n\n            // SWAP_REQ 的请求位：软件写它（写 0 撤销），场起始那一刻锁存并清零"
