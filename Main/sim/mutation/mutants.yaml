# 变异清单（唯一真相）。每条记录对应一处生产源码的故意改错。
# 字段：defect 缺陷模型；spec 规格出处；rules 字面替换（每条必须唯一匹配，同一宏可多处）；
# runs 应发现它的命令与见红位置正则；macro 只用于追溯原来的 ifdef 开关。
# 校验与执行：run_mutation.py；迁移等价性：verify_migration.py。
- id: band.band_addr_stride
  target: Main/rtl/engine/buffer/engine_band.v
  macro: INJ_BAND_ADDR_STRIDE
  defect: 地址与对齐
  spec:
    doc: Main/rtl/engine/engine-manual.md
    section: 4.3 计算阵列（engine_pix）
  rules:
  - find: '            idx = yy * ROW_WORDS + col;'
    replace: '            idx = (yy << 8) + col; // 注错：按 256 词固定行距换算，行宽不同时错位'
  runs:
  - cmd: python3 Main/tools/check/check_g2_band.py
    log: Main/sim/engine/band/logs
    evidence: ''
  note: 注错：按 256 词固定行距换算，行宽不同时错位
- id: band.band_early_flush
  target: Main/rtl/engine/buffer/engine_band.v
  macro: INJ_BAND_EARLY_FLUSH
  defect: 排空与生命周期
  spec:
    doc: Main/rtl/engine/engine-manual.md
    section: 4.3 计算阵列（engine_pix）
  rules:
  - find: '    assign flush_ready = (phase == EXEC) && !rd_busy && !wr_busy && !cancel && !lease_blk;'
    replace: '    assign flush_ready = (phase == EXEC) && !cancel; // 注错：flush 提前，本地流没收尾'
  runs:
  - cmd: python3 Main/tools/check/check_g2_band.py
    log: Main/sim/engine/band/logs
    evidence: ''
  note: 注错：flush 提前，本地流没收尾
