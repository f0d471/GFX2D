  runs:
  - cmd: bash Main/sim/display/run.sh
    log: Main/sim/display/build
    evidence: 'swap: RESULT: FAIL'
  note: 注错 SWAP_NOW：写请求立刻切换，不等场起始（会切出撕裂帧）
