  note: 注错：像素号截到 11 位，每 2048 个位置别名一次
- id: bin.bin_clip
  target: Main/rtl/engine/frontend/engine_bin.v
  macro: INJ_BIN_CLIP
  defect: 表面谓词
  spec:
    doc: Main/doc/赛题二总体设计.md
    section: 3.4 命令与软件接口
  rules:
  - find: '    reg [31:0] xy,uv;'
    replace: "    reg [63:0] inj_last_clip;\n    reg [31:0] xy,uv;"
  - find: '                    clip<=read_beat[63:0];'
    replace: '                    clip<=inj_last_clip;'
  - find: "                    packets<=index;scan<=0;prefix<=0;total_refs<=0;read_bucket(0,PREFIX);end\n                     else if(io_ready)io(0,input_base+(index<<5),32,512'd0,GOT);"
    replace: "                    inj_last_clip<=clip;\n                    packets<=index;scan<=0;prefix<=0;total_refs<=0;read_bucket(0,PREFIX);end\n                     else if(io_ready)io(0,input_base+(index<<5),32,512'd0,GOT);"
  - find: '                        packets<=index;scan<=0;prefix<=0;total_refs<=0;read_bucket(0,PREFIX);end'
    replace: "                        inj_last_clip<=clip;\n                        packets<=index;scan<=0;prefix<=0;total_refs<=0;read_bucket(0,PREFIX);end"
  runs:
  - cmd: python3 Main/tools/check/check_f5_bin.py --models --bin --frame --protocols --lease
    log: Main/sim/engine/frontend/logs
    evidence: ''
  note: TODO
