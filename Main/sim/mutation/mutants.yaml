    replace: "    // 注错：像素号截到 11 位，每 2048 个位置别名一次\n    wire [RAST_PIX_AW-1:0] ras_pix = {{(RAST_PIX_AW-11){1'b0}}, ras_wr_pix[10:0]};"
  runs:
  - cmd: python3 Main/tools/check/check_r2.py --group rtl
