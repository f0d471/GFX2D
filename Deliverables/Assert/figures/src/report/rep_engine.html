<!DOCTYPE html>

<style>
.st { position: absolute; box-sizing: border-box; border: 2px solid; border-radius: 4px;

.st .t { font-size: 20px; font-weight: 700; line-height: 1.25; }

<body><div id="fig" style="width:1040px;height:440px">

<div class="st ctl" style="left:30px;top:20px;width:170px;height:74px">

</div>
<div class="st mem" style="left:220px;top:20px;width:170px;height:74px">
  <div class="t">命令表 A / B</div>
  <div class="s">各 1 MB</div>
</div>
<div class="st mem" style="left:430px;top:20px;width:200px;height:74px">
  <div class="t">表面表</div>
  <div class="s">基址 · 宽高<br>行跨 · 格式</div>
</div>

<div class="st ctl" style="left:30px;top:126px;width:170px;height:124px">

</div>
<div class="st ctl" style="left:230px;top:126px;width:150px;height:124px">

<div class="st ctl" style="left:410px;top:126px;width:200px;height:124px">

</div>
<div class="st cmp" style="left:640px;top:126px;width:170px;height:124px">

</div>
<div class="st cmp" style="left:840px;top:126px;width:170px;height:124px">

</div>

<div class="st dat" style="left:30px;top:280px;width:980px;height:62px">

  <div class="s">128 位 @ 100 MHz · 单次突发 ≤192 拍（一行 160 拍）</div>
</div>
