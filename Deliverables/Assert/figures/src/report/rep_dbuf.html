<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="fig-size" content="1040x410">
<link rel="stylesheet" href="_rep.css">
<style>
.lane { position: absolute; left: 150px; right: 30px; height: 52px; }
.bar { position: absolute; top: 0; height: 52px; box-sizing: border-box; border: 2px solid;
       border-radius: 4px; display: flex; align-items: center; justify-content: center;
       font-size: 15.5px; font-weight: 700; }
.vl { position: absolute; top: 70px; width: 1.5px; height: 300px; background: #C6CCD4; }
.vlb { position: absolute; white-space: nowrap; font-size: 14px; color: #6B7684; transform: translateX(-50%); }
.dm { position: absolute; width: 15px; height: 15px; background: #EFD9A8; border: 2px solid #8A6410;
      transform: rotate(45deg); }
</style></head>
<body><div id="fig" style="width:1040px;height:410px">

<!-- field boundaries abs x: 140 + k*176 -->
<div class="vl" style="left:140px"></div><div class="vl" style="left:316px"></div>
