<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="fig-size" content="900x300">
<link rel="stylesheet" href="_rep.css">
<style>
.panel { position: absolute; width: 320px; height: 200px; box-sizing: border-box;
         border: 2px solid #87929E; background: #FBFCFD; }
.box { position: absolute; box-sizing: border-box; }
.cap { position: absolute; width: 320px; text-align: center; font-size: 16px; color: #1D2733; }
.tag { position: absolute; font-size: 15px; color: #4A5568; }
</style></head>
<body><div id="fig" style="width:900px;height:300px">

<!-- 左：关闭深度判断，后画者覆盖 -->
<div class="panel" style="left:40px;top:16px">
  <div class="box" style="left:34px;top:64px;width:150px;height:110px;background:#EDF3FB;border:2px solid #4A7FD0"></div>
  <div class="box" style="left:140px;top:36px;width:130px;height:96px;background:#E9EDF2;border:2px solid #87929E"></div>
</div>
<div class="cap" style="left:40px;top:232px">关闭深度判断：后绘制的远物覆盖近物</div>

<!-- 右：开启深度判断，近者保留 -->
<div class="panel" style="left:540px;top:16px">
  <div class="box" style="left:140px;top:36px;width:130px;height:96px;background:#E9EDF2;border:2px solid #87929E"></div>
  <div class="box" style="left:34px;top:64px;width:150px;height:110px;background:#EDF3FB;border:2px solid #4A7FD0"></div>
</div>
<div class="cap" style="left:540px;top:232px">开启深度判断：保留较近的像素</div>

<div class="lbl" style="left:412px;top:100px;font-size:26px">→</div>

</div></body></html>
