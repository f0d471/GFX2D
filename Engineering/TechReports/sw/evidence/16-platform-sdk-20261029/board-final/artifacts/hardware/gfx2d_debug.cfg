# gfx2d 板上调试用的 OpenOCD 配置：加载程序、读寄存器。
#
# 用法（board_run.py 就是这样调的）：
#     openocd.exe -c "set ::env(workspace_loc) {<仓库>/Main/sdk}" -f tools/board/gfx2d_debug.cfg \
#                 -c "reset halt" -c "load_image {<bin>} 0x1000 bin" -c "resume 0x1000" -c "shutdown"
# workspace_loc 指向 `cpu0.yaml` 所在目录。用 -c 在 Tcl 里设而不是设环境变量：从 WSL 调 openocd.exe 时
# 自定义环境变量传不进 Windows 进程，-c 两边都成立。
#
# ## 为什么不用 sdk 里的官方 cfg
#
# `sdk/bsp/efinix/EfxSapphireSoc/openocd/` 下的 `debug.cfg` 与 `debug_ti.cfg` 是 IP 生成物，
# 重新生成会被覆盖，而且它们在**这块板上**有两处对不上：
#
#   1. `jtag newtap ... -irlen N`：`debug.cfg` 写的是 4，本板的 IR 宽度是 5
#      （`ftdi_pgm.bat --scan_usb` 报 `ir_width 5`，`debug_ti.cfg` 里也是 5）。
#      用 4 会报 `IR capture error at bit 4, saw 0x25 not 0x..3`，根本连不上 CPU。
#   2. `cpu0.yaml` 的查找：两份 cfg 都写死「从当前目录往上最多 3 级」，
#      而实际运行目录（例如 `Main/sw/apps/<类>/<程序>/`）要往上 4 级到 `Main/` 再进 `sdk/` 才是 `cpu0.yaml`，不在上级链路上，
#      在仓库外的工程副本里更远。它们有一个 `LEGACY_IDE` 分支改用
#      `$::env(workspace_loc)/cpu0.yaml`，本文件就是按那一支改写的。
#
# 这两条 2026-09-17 在 E1 的上板过程中实测确认，过程见
# `Engineering/TechReports/platform/04-*.md`。
#
# 本文件只复刻 `debug_ti.cfg` 的取值，不改动任何官方文件。

set  _ENDIAN little
set _TAP_TYPE 1234
set cpu_count 1
set instr_addr 0x00001000

# tap id 允许由环境变量覆盖（另一块板或别的器件时会变）
if { [info exists env(CPUTAPID)] } {
    set _CPUTAPID $::env(CPUTAPID)
} else {
    set _CPUTAPID 0x10660A79
}

set STANDARD_DEBUG 0
set LEGACY_IDE 1

# ---- 适配器与 tap：取自 sdk 的 ftdi_ti.cfg，参数未改，只有 irlen 按本板取 5 ----
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 1
ftdi layout_init 0x08 0x0b
adapter speed 800
adapter srst delay 260
jtag_ntrst_delay 250

set _CHIPNAME fpga_spinal
jtag newtap $_CHIPNAME bridge -expected-id $_CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF

# ---- 目标：dbgbase / coreid / jtagMapping / readWaitCycles 取自 debug_ti.cfg ----
for {set i 0} {$i < $cpu_count} {incr i} {
    target create $_CHIPNAME.cpu$i vexriscv -endian $_ENDIAN \
        -chain-position $_CHIPNAME.bridge -coreid $i \
        -dbgbase [expr $i*0x1000+0x10B80000] \
        -work-area-phys 0xF9000000 -work-area-size 1024
    vexriscv readWaitCycles 40
    vexriscv cpuConfigFile [file join $::env(workspace_loc) cpu$i.yaml]
    vexriscv jtagMapping 8 8 0 1 2 2
}

for {set i 0} {$i < $cpu_count} {incr i} {
    targets $_CHIPNAME.cpu$i
    poll_period 50
    init
    halt
}
