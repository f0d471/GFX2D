<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .bs { fill:#eff6ff; stroke:#1d4ed8; stroke-width:1.2 }
      .bt { fill:#fffbeb; stroke:#b45309; stroke-width:1.2 }
      .bh { fill:#f0fdf4; stroke:#15803d; stroke-width:1.2 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .dep { stroke:#334155; stroke-width:1.4; fill:none }
      .un  { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">gfx2d 同一份应用的两条落地路径与跨平台判据</text>
  <text x="40" y="60" font-size="12" fill="#64748b">2026-09-19 上板验证。板上与主机的 60 帧整帧 CRC32 逐帧比对，注错版从第 0 帧起不同。</text>

  <!-- 同一份源码 -->
  <rect x="40" y="88" width="300" height="230" class="bs"/>
  <text x="60" y="111" class="t" font-weight="600">同一份源码</text>
  <text x="60" y="135" class="ts">gfx2dGame/src/main.c</text>
  <text x="60" y="155" class="ts">lib/core/crc32.c　流式查表 CRC32</text>
  <text x="60" y="175" class="ts">lib/core/xorshift32.c　图案种子</text>
  <text x="60" y="195" class="ts">lib/core/format.c　输出行</text>
  <text x="60" y="215" class="ts">bsp/include/board.h　板级服务</text>
  <path d="M60,228 H320" class="un"/>
  <text x="60" y="249" class="ts">每帧：以帧号为种子铺满 640×480</text>
  <text x="60" y="269" class="ts">行跨 4096 字节，逐行算 CRC32</text>
  <text x="60" y="289" class="ts">帧缓冲两块交替用（0 与 1）</text>
  <text x="60" y="309" class="ts">应用里没有平台判断</text>

  <!-- 两条路径 -->
  <rect x="380" y="88" width="380" height="104" class="bt"/>
  <text x="400" y="111" class="t" font-weight="600">板上：mk/target.mk + bsp/ti60</text>
  <text x="400" y="135" class="ts">DDR3 帧缓冲　0x0200_0000 / 0x0240_0000</text>
  <text x="400" y="155" class="ts">UART0 115200 8N1　→　COM11</text>
  <text x="400" y="175" class="ts">一帧约 3270 万周期（CLINT 实测）</text>

  <rect x="380" y="214" width="380" height="104" class="bh"/>
  <text x="400" y="237" class="t" font-weight="600">主机：mk/host.mk + bsp/host</text>
  <text x="400" y="261" class="ts">64MB 模拟 DDR，分区偏移与板上相同</text>
  <text x="400" y="281" class="ts">stdout　→　pc_normal.log</text>
  <text x="400" y="301" class="ts">SDL2 窗口 640×480，XRGB8888</text>

  <!-- 产物 -->
  <rect x="800" y="88" width="180" height="104" class="bx"/>
  <text x="816" y="111" class="t" font-weight="600">board_normal.log</text>
  <text x="816" y="135" class="ts">60 行</text>
  <text x="816" y="155" class="ts">frame N crc X</text>
  <text x="816" y="175" class="ts">cycles 每帧不同</text>

  <rect x="800" y="214" width="180" height="104" class="bx"/>
  <text x="816" y="237" class="t" font-weight="600">pc_normal.log</text>
  <text x="816" y="261" class="ts">60 行</text>
  <text x="816" y="281" class="ts">frame N crc X</text>
  <text x="816" y="301" class="ts">cycles 每帧不同</text>

  <!-- 比对 -->
  <rect x="1020" y="88" width="180" height="230" class="b"/>
  <text x="1040" y="111" class="t" font-weight="600">逐帧比对</text>
  <text x="1040" y="137" class="ts">只取 frame N crc X</text>
  <text x="1040" y="155" class="ts">这一列比对</text>
  <path d="M1040,172 H1180" class="un"/>
  <text x="1040" y="197" class="ts">60 帧</text>
  <text x="1040" y="215" class="ts">逐帧相同</text>
  <text x="1040" y="245" class="ts">注错版</text>
  <text x="1040" y="263" class="ts">从第 0 帧起不同</text>
  <text x="1040" y="295" class="ts">两次运行之间</text>
  <text x="1040" y="311" class="ts">CRC 列不变</text>

  <path d="M340,133 H380" class="dep" marker-end="url(#at)"/>
  <path d="M340,266 H380" class="dep" marker-end="url(#ah)"/>
  <path d="M760,133 H800" class="dep" marker-end="url(#a)"/>
  <path d="M760,266 H800" class="dep" marker-end="url(#a)"/>
  <path d="M980,133 H1020" class="dep" marker-end="url(#a)"/>
  <path d="M980,266 H1020" class="dep" marker-end="url(#a)"/>

  <!-- 判据做法 -->
  <rect x="40" y="340" width="1160" height="130" class="b"/>
  <text x="60" y="363" class="t" font-weight="600">判据的做法与覆盖范围</text>
  <text x="60" y="387" class="ts">diff &lt;(grep -o 'frame [0-9]* crc [0-9a-f]*' logs/pc_normal.log) \</text>
  <text x="60" y="405" class="ts">     &lt;(grep -o 'frame [0-9]* crc [0-9a-f]*' logs/board_normal.log)　　无输出即通过</text>
  <text x="60" y="431" class="ts">CRC 覆盖每一行的前 2560 字节（640 个像素），不含行尾没有写过的间隙；两边覆盖范围相同</text>
  <text x="60" y="451" class="ts">算 CRC 之前 board_dcache_invalidate_all()：读到的是 DDR 里的字节，不是数据缓存里的副本（E3 规则）</text>

  <!-- 注错 -->
  <rect x="40" y="492" width="560" height="148" class="bt"/>
  <text x="60" y="515" class="t" font-weight="600">注错：把随机数的一个移位常数改掉</text>
  <text x="60" y="539" class="ts">make INJECT=XS32_SHIFT</text>
  <text x="60" y="559" class="ts">lib/core/xorshift32.c 里第一个移位常数 13 改成 12</text>
  <text x="60" y="585" class="ts">正常版　frame 0 crc cf8e2861</text>
  <text x="60" y="605" class="ts">注错版　frame 0 crc fe77d971</text>
  <text x="60" y="627" class="ts">60 帧没有一帧相同，从第 0 帧起分叉</text>

  <rect x="640" y="492" width="560" height="148" class="bh"/>
  <text x="660" y="515" class="t" font-weight="600">同一条注错在主机上也跑一遍</text>
  <text x="660" y="539" class="ts">pc_inject.log 与 board_inject.log 同样逐帧相同</text>
  <text x="660" y="563" class="ts">两个平台的差异只由源码里的常数决定，不来自平台</text>
  <text x="660" y="589" class="ts">判据成立的两半：不注错时两边相同，</text>
  <text x="660" y="607" class="ts">注错时确实变红；缺一半这条判据就是空转</text>

  <!-- 图例 -->
  <rect x="40" y="660" width="1160" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M56,684 H96" class="dep" marker-end="url(#a)"/>
  <text x="104" y="688" class="ts">数据与控制的流向</text>
  <path d="M240,684 H280" class="un"/>
  <text x="288" y="688" class="ts">分段与范围标注</text>
  <rect x="430" y="676" width="26" height="16" class="bs"/>
  <text x="464" y="689" class="ts">两平台共用</text>
  <rect x="560" y="676" width="26" height="16" class="bt"/>
  <text x="594" y="689" class="ts">板上那一侧</text>
  <rect x="690" y="676" width="26" height="16" class="bh"/>
  <text x="724" y="689" class="ts">主机那一侧</text>
  <text x="830" y="689" class="ts">四份日志入库在 sw/gfx2dGame/logs/，与登记的产物一一对应。</text>
</svg>
