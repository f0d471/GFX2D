<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b    { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bn   { fill:#eff6ff; stroke:#1d4ed8; stroke-width:1.3 }
      .bg   { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.1; stroke-dasharray:5 4 }
      .tt   { font-size:12.5px; font-weight:600; fill:#0f172a }
      .t    { font-size:11px; fill:#0f172a }
      .ts   { font-size:9.5px; fill:#475569 }
      .tg   { font-size:11px; font-weight:600; fill:#64748b }
      .tgs  { font-size:9.5px; fill:#94a3b8 }
      .flow { stroke:#334155; stroke-width:1.4; fill:none }
      .gen  { stroke:#334155; stroke-width:1.4; fill:none; stroke-dasharray:10 4 }
      .un   { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="600" fill="#0f172a">MYRIAD 游戏一帧的通路</text>
  <text x="40" y="58" font-size="12" fill="#64748b">SW7 结束时的状态，2026-09-28。src/game/ 下的代码不含 board.h，由 app 测试与搜索器直接编；PC 与板上跑同一份应用与 lib。</text>

  <!-- ===== 第一行：输入的四个来源 ===== -->
  <text class="tg" x="48" y="86">输入（每帧一个按键位图，STG_KEY_* 与 BOARD_KEY_* 同值）</text>
  <rect class="b" x="48" y="96" width="262" height="66" rx="2"/>
  <text class="tt" x="60" y="116">board_keys()（bsp）</text>
  <text class="ts" x="60" y="134">模式框架的模式 2：实时按键</text>
  <text class="ts" x="60" y="150">和弦由框架吃掉（第 07 章）</text>

  <rect class="bn" x="326" y="96" width="262" height="66" rx="2"/>
  <text class="tt" x="338" y="116">stg_script（STG_FIELD=4）</text>
  <text class="ts" x="338" y="134">xorshift32 定种子，每 30 帧换方向</text>
  <text class="ts" x="338" y="150">受击默认关掉</text>

  <rect class="bn" x="604" y="96" width="262" height="66" rx="2"/>
  <text class="tt" x="616" y="116">stg_auto（STG_JUDGE_AUTO=1）</text>
  <text class="ts" x="616" y="134">九个候选，危险度加偏好（第 07 章）</text>
  <text class="ts" x="616" y="150">模式 2 里无人 600 帧后接管</text>

  <rect class="bn" x="882" y="96" width="310" height="66" rx="2"/>
  <text class="tt" x="894" y="116">replay/stg_clear.g2dr（STG_JUDGE_REPLAY=1）</text>
  <text class="ts" x="894" y="134">工具辅助的通关录像，9208 帧</text>
  <text class="ts" x="894" y="150">构建时经 replay2c.py 转成 C 数组</text>

  <line class="flow" x1="179" y1="162" x2="179" y2="186"/>
  <line class="flow" x1="457" y1="162" x2="457" y2="186"/>
  <line class="flow" x1="735" y1="162" x2="735" y2="186"/>
  <line class="flow" x1="1037" y1="162" x2="1037" y2="186"/>
  <line class="flow" x1="179" y1="186" x2="1037" y2="186"/>
  <line class="flow" x1="330" y1="186" x2="330" y2="208" marker-end="url(#a)"/>

  <!-- ===== 第二行：一帧推进与游戏状态 ===== -->
  <rect class="bn" x="48" y="210" width="564" height="196" rx="2"/>
  <text class="tt" x="60" y="230">stg_game_step(g, keys)：一帧的七步（契约）</text>
  <text class="t" x="60" y="252">1 输入与阶段切换：标题 120 帧、CLEAR 180 帧；对立方向当该轴不动</text>
  <text class="t" x="60" y="272">2 四个池各一遍：更新、出界、稳定压缩（stg_pool_step）；粒子寿命</text>
  <text class="t" x="60" y="292">3 自机移动与自动射击</text>
  <text class="t" x="60" y="312">4 事件表（杂兵段）；Boss 的按时间切换（进场、间隙、超时）</text>
  <text class="t" x="60" y="332">5 敌机按槽位齐射与移动；Boss：符卡的发射器，终符由令牌门控</text>
  <text class="t" x="60" y="352">6 碰撞：自机弹对敌机与 Boss，自机判定点对敌弹（严格小于）</text>
  <text class="t" x="60" y="372">7 结算：击毁、符卡结束；无敌先减一，再受击与炸弹；局的结束</text>
  <text class="ts" x="60" y="394">第 k 帧的状态指第 k 帧第 7 步之后；全是整数，逐颗循环里没有除法与间接调用</text>

  <rect class="bn" x="636" y="210" width="556" height="196" rx="2"/>
  <text class="tt" x="648" y="230">stg_game：游戏的全部状态（一个结构体，约 390 KB）</text>
  <text class="t" x="648" y="252">stg_field：四个池（敌弹 16384、自机弹 256、敌机 64、粒子 2048），</text>
  <text class="t" x="648" y="270">  20 字节 AoS 实体，存储在 stg_pools 里（ent 指向结构体内部）</text>
  <text class="t" x="648" y="290">stg_enemies：64 个槽，血量、移动事件表游标、1~4 个发射器</text>
  <text class="t" x="648" y="310">stg_boss：符卡、血量、发射器、门控（K、累加器、令牌、轮转）</text>
  <text class="t" x="648" y="330">stg_stage.c（常量）：事件表 28 条、符卡表 4 张、移动事件表 6 张</text>
  <text class="t" x="648" y="350">stg_bg：网格相位与 60 个星点；xorshift32；自机、残机、炸弹、得分</text>
  <text class="ts" x="648" y="372">给第 07 章的钩子：stg_game_press_begin、stg_game_set_knob、</text>
  <text class="ts" x="648" y="388">stg_game_set_hits（压力形态：终符、Boss 不动、受击关掉、弹种替换）</text>
  <line class="flow" x1="612" y1="308" x2="634" y2="308" marker-end="url(#a)"/>

  <line class="flow" x1="330" y1="406" x2="330" y2="436" marker-end="url(#a)"/>

  <!-- ===== 第三行：组帧 ===== -->
  <rect class="bn" x="48" y="438" width="564" height="150" rx="2"/>
  <text class="tt" x="60" y="458">stg_game_compose：整帧组帧（stg_draw）</text>
  <text class="t" x="60" y="480">SET_CLIP 游戏区 → 背景 89 条 → 敌机 → Boss → 自机 → 判定点</text>
  <text class="t" x="60" y="500">→ 自机弹 ADD → 敌弹 ALPHA（按弹种）→ 粒子 ADD → 标题 / CLEAR</text>
  <text class="t" x="60" y="520">→ 闪白 CONST → SET_CLIP 全屏 → HUD（stg_text 逐字 BLIT）→ END</text>
  <text class="ts" x="60" y="542">stg_pool_draw 游标分段（每段 128 条）→ gfx_blit_run 批量提交</text>
  <text class="ts" x="60" y="558">活动元素 = 发出的 Sprite 命令，按敌弹、自机弹、敌机、粒子、自机分类</text>
  <text class="ts" x="60" y="574">整帧每个像素都被写到：整帧 CRC 与上一帧无关</text>

  <rect class="b" x="636" y="438" width="270" height="150" rx="2"/>
  <text class="tt" x="648" y="458">命令表（lib/gfx，32 字节一条）</text>
  <text class="ts" x="648" y="478">双缓冲：两张表按全局帧序号轮换</text>
  <text class="ts" x="648" y="496">S1 规模：约 2250 条，</text>
  <text class="ts" x="648" y="512">COPY 206、ALPHA 2040、SET_CLIP 2</text>
  <text class="ts" x="648" y="530">游戏（自动驾驶）平均约 38 万像素</text>

  <rect class="b" x="922" y="438" width="270" height="68" rx="2"/>
  <text class="tt" x="934" y="458">gfx_census（普查）</text>
  <text class="ts" x="934" y="476">按方程数条数与面积，每帧自查</text>
  <text class="ts" x="934" y="492">与组帧按类记下的相符</text>

  <rect class="b" x="922" y="520" width="270" height="68" rx="2"/>
  <text class="tt" x="934" y="540">exec_sw_run（软件执行器）</text>
  <text class="ts" x="934" y="558">逐像素照 spec 第 01 章画进帧缓冲</text>
  <text class="ts" x="934" y="574">第 02 章；PC 与板上同一份代码</text>

  <line class="flow" x1="612" y1="513" x2="634" y2="513" marker-end="url(#a)"/>
  <polyline class="flow" points="906,480 914,480 914,472 920,472" marker-end="url(#a)"/>
  <polyline class="flow" points="906,554 920,554" marker-end="url(#a)"/>

  <rect class="bg" x="922" y="604" width="270" height="52" rx="2"/>
  <text class="tg" x="934" y="624">硬件引擎（引擎 P1，未接入）</text>
  <text class="tgs" x="934" y="642">同一张命令表的另一个执行者，SW9 接</text>
  <polyline class="un" points="906,570 912,570 912,630 920,630" marker-end="url(#ag)"/>

  <!-- ===== 第四行：输出与判据 ===== -->
  <rect class="b" x="636" y="604" width="270" height="92" rx="2"/>
  <text class="tt" x="648" y="624">帧缓冲 FB0 / FB1 → 呈现</text>
  <text class="ts" x="648" y="642">整帧 640×480 的 CRC32（逐行 2560 字节）</text>
  <text class="ts" x="648" y="658">PC：SDL2 窗口，或 GFX2D_SNAPSHOT 截帧</text>
  <text class="ts" x="648" y="674">板上：扫描输出 → HDMI（display 第 01 章）</text>
  <polyline class="flow" points="1057,588 1057,596 780,596 780,602" marker-end="url(#a)"/>

  <rect class="bn" x="48" y="604" width="564" height="92" rx="2"/>
  <text class="tt" x="60" y="624">判据入口的日志（STG_FIELD=4，PC 上 GFX2D_UNPACED=1 不等场）</text>
  <text class="t" x="60" y="644">seg &lt;帧号&gt; &lt;段名&gt;；g &lt;帧号&gt; … crc &lt;整帧 CRC32&gt;；fail；done</text>
  <text class="t" x="60" y="664">回放时另打 clear 与 end 两行（与搜索器的摘要同格式）</text>
  <text class="ts" x="60" y="684">两遍逐字节相同；HUD 的实时量在判据里一律 --</text>
  <line class="flow" x1="636" y1="650" x2="614" y2="650" marker-end="url(#a)"/>

  <!-- ===== 第五行：搜索器 ===== -->
  <rect class="bn" x="48" y="724" width="564" height="130" rx="2"/>
  <text class="tt" x="60" y="744">Main/tools/check/gen_stg_clear.c（搜索器，主机上跑）</text>
  <text class="t" x="60" y="764">只链 lib/ 与 src/game/stg_*.c，逐帧调 stg_game_step，不组帧</text>
  <text class="t" x="60" y="784">每 4 帧一块，18 个候选，块末推演 64 帧择优；走不下去就回退、禁用</text>
  <text class="t" x="60" y="804">同一前沿失败满 14 次允许中弹（炸弹或残机抵掉）</text>
  <text class="ts" x="60" y="824">存档经 snap_copy：拷完把四个池的 ent 改回副本自己的存储</text>
  <text class="ts" x="60" y="840">--verify 的 seg / clear / end 与回放入口逐行比（G16c）</text>

  <rect class="b" x="636" y="724" width="270" height="130" rx="2"/>
  <text class="tt" x="648" y="744">这一份录像的结果</text>
  <text class="ts" x="648" y="764">CLEAR 在第 9027 帧，回到标题 9207</text>
  <text class="ts" x="648" y="780">中弹 4 次：3 次自动炸弹、1 次扣残机</text>
  <text class="ts" x="648" y="796">得分 21280、擦弹 938、残机 2</text>
  <text class="ts" x="648" y="812">重搜逐字节相同（G16b）</text>
  <text class="ts" x="648" y="828">改第 200~203 帧的按键：</text>
  <text class="ts" x="648" y="844">从第 200 帧起不同（G16i）</text>
  <line class="flow" x1="612" y1="789" x2="634" y2="789" marker-end="url(#a)"/>

  <polyline class="gen" points="612,740 622,740 622,712 1212,712 1212,129 1194,129" marker-end="url(#a)"/>
  <text class="ts" x="930" y="706">--out 写出 .g2dr，入库</text>

  <!-- ===== 图例 ===== -->
  <rect class="bn" x="922" y="740" width="22" height="14" rx="2"/>
  <text class="ts" x="952" y="751">本章（SW7）新做的</text>
  <rect class="b" x="922" y="764" width="22" height="14" rx="2"/>
  <text class="ts" x="952" y="775">已有的（前几章）</text>
  <rect class="bg" x="922" y="788" width="22" height="14" rx="2"/>
  <text class="ts" x="952" y="799">还没有接入</text>
  <line class="flow" x1="922" y1="818" x2="944" y2="818" marker-end="url(#a)"/>
  <text class="ts" x="952" y="822">每帧的数据流</text>
  <line class="gen" x1="922" y1="838" x2="944" y2="838" marker-end="url(#a)"/>
  <text class="ts" x="952" y="842">离线生成、入库</text>
</svg>
