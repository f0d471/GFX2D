<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="1240" height="790" fill="white"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#172033">
<text x="40" y="42" font-size="26">G3：同批绘制调用经分桶进入帧级条带控制</text>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M325 138H415"/><path d="M755 138H850"/><path d="M1020 204V228H230V264"/><path d="M420 339H518"/><path d="M762 339H860"/><path d="M1017 393V470H640V518"/><path d="M800 588H890"/><path d="M1040 644V668H1220V245H640V264"/></g>
<g stroke="#475569" stroke-width="2">
<rect x="40" y="80" width="285" height="124" rx="8" fill="#eff6ff"/>
<rect x="415" y="80" width="340" height="124" rx="8" fill="#eff6ff"/>
<rect x="850" y="80" width="340" height="124" rx="8" fill="#f8fafc"/>
<rect x="40" y="264" width="380" height="129" rx="8" fill="#eff6ff"/>
<rect x="518" y="264" width="244" height="129" rx="8" fill="#f0fdf4"/>
<rect x="860" y="264" width="330" height="129" rx="8" fill="#fff7ed"/>
<rect x="420" y="518" width="380" height="126" rx="8" fill="#f0fdf4"/>
<rect x="890" y="518" width="300" height="126" rx="8" fill="#f8fafc"/>
</g>
<g font-size="21"><text x="60" y="111">绘制 API</text><text x="435" y="111">生产 list / strip 构造器</text><text x="870" y="111">DDR 条带表</text><text x="60" y="296">engine_cmd / FE</text><text x="538" y="296">LOAD 背景</text><text x="880" y="296">EXEC 桶内记录</text><text x="440" y="550">geom → pix → mover</text><text x="910" y="550">FLUSH 与下一桶</text></g>
<g font-size="17"><text x="60" y="147">SET_CLIP / FILL / BLIT</text><text x="60" y="178">同帧多次 clip 调用保留</text><text x="435" y="147">吸收 clip、裁剪、跨桶复制保序</text><text x="435" y="178">先查全部桶容量，再原子追加</text><text x="870" y="147">首个 32 KiB 段：128 B 计数</text><text x="870" y="178">桶 s：+(s+1) × 32 KiB</text><text x="60" y="332">锁存配置 → 取表头 → 逐桶三相</text><text x="60" y="365">16 条 / 批，失败逐条回退</text><text x="538" y="332">单 BAND 40 KiB</text><text x="538" y="365">loaded 才能执行</text><text x="880" y="332">NOP / FILL / BLIT，计数为界</text><text x="880" y="365">空桶跳过命令取数</text><text x="440" y="586">局部 y 加 strip_y0 → 全帧描述符</text><text x="440" y="617">TEX/DDR 源，BAND 目的读写</text><text x="910" y="586">等待全部写响应</text><text x="910" y="617">最后一桶后 LIST_DONE</text></g>
<text x="40" y="526" font-size="19">等价前提</text><text x="40" y="560" font-size="17">桶内保序，跨桶目的不相交</text><text x="40" y="590" font-size="17">DDR 源 / 目的反馈别名拒绝</text><text x="40" y="620" font-size="17">SET_CLIP / END 不进原始桶表</text>
<text x="40" y="696" font-size="19">失败路径：停止推进 → 活动命令与预取收尾 → mover 排空 → ERROR / 空闲</text>
<text x="40" y="730" font-size="17">ERROR_INDEX = strip × 1024 + k；w7 原样；失败桶不写回，之前完成的桶不回滚。</text>
<text x="40" y="764" font-size="15" fill="#64748b">箭头表示控制推进；LOAD/FLUSH 使用 DDR，EXEC 的目的只访问片上 BAND。数据宽度为 128 位。</text>
</g></svg>
