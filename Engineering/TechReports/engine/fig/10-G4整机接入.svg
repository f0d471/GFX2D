<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="590" viewBox="0 0 1020 590"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#385c7c"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#20364b} .h{font-size:21px;font-weight:700}.t{font-size:16px}.s{font-size:13px}.b{fill:#f2f7fc;stroke:#6b8eaf;stroke-width:1.5}.g{fill:#eef6ed;stroke:#6f9c61;stroke-width:1.5}.w{fill:#fff7e8;stroke:#b98c41;stroke-width:1.5}.e{fill:none;stroke:#385c7c;stroke-width:1.6;marker-end:url(#a)}</style></defs><rect width="1020" height="590" fill="white"/><text x="30" y="38" class="h">G4：同一游戏状态，直通与条带共存</text><text x="30" y="65" class="s">组帧调用保持一致；条带在构造时吸收裁剪、复制跨桶片段，再按计数提交。</text><rect x="30" y="92" width="290" height="330" rx="6" class="b"/><text x="50" y="120" class="h">CPU</text><rect x="55" y="140" width="240" height="54" class="w"/><text x="175" y="163" text-anchor="middle" class="t">游戏逻辑与 stg_game_compose</text><text x="175" y="183" text-anchor="middle" class="s">相同负载、相同绘制顺序</text><path d="M175 194V219" class="e"/><rect x="55" y="220" width="240" height="62" class="w"/><text x="175" y="244" text-anchor="middle" class="t">gfx_list / gfx_blit_run</text><text x="175" y="265" text-anchor="middle" class="s">模板校验复用；v2 裁剪与原子分桶</text><path d="M115 282V309" class="e"/><path d="M235 282V309" class="e"/><rect x="50" y="310" width="120" height="72" class="b"/><text x="110" y="336" text-anchor="middle" class="t">v1 扁平表</text><text x="110" y="360" text-anchor="middle" class="s">COUNT / END</text><rect x="185" y="310" width="120" height="72" class="b"/><text x="245" y="336" text-anchor="middle" class="t">v2 条带表</text><text x="245" y="360" text-anchor="middle" class="s">表头 + 30 桶</text><rect x="360" y="92" width="310" height="330" rx="6" class="g"/><text x="380" y="120" class="h">FPGA 引擎</text><rect x="385" y="140" width="260" height="66" class="g"/><text x="515" y="164" text-anchor="middle" class="t">APB 提交 / engine_cmd</text><text x="515" y="187" text-anchor="middle" class="s">同一 bit；运行时选择直通或 BAND</text><path d="M170 348H178V401H338V162H385M305 348H350V190H385" class="e"/><rect x="385" y="235" width="260" height="58" class="g"/><text x="515" y="260" text-anchor="middle" class="t">TEX 16 KiB 源纹理</text><text x="515" y="282" text-anchor="middle" class="s">标准圆弹 / 小圆弹 / 火花</text><path d="M515 206V235M515 293V319" class="e"/><rect x="385" y="320" width="260" height="76" class="g"/><text x="515" y="345" text-anchor="middle" class="t">BAND 640 × 16 行</text><text x="515" y="370" text-anchor="middle" class="t">LOAD → EXEC → FLUSH</text><text x="515" y="414" text-anchor="middle" class="s">直通模式绕过 BAND，目的仍走 DDR</text><rect x="710" y="92" width="280" height="330" rx="6" class="b"/><text x="730" y="120" class="h">DDR / 扫描输出</text><rect x="735" y="160" width="230" height="66" class="w"/><text x="850" y="185" text-anchor="middle" class="t">双命令表 / 双帧缓冲</text><text x="850" y="208" text-anchor="middle" class="s">每面 640 × 480；行跨 4096 B</text><path d="M645 357H690V209H735" class="e"/><path d="M850 226V276" class="e"/><rect x="735" y="277" width="230" height="76" class="b"/><text x="850" y="303" text-anchor="middle" class="t">display / 512 拍 FIFO</text><text x="850" y="327" text-anchor="middle" class="t">HDMI 640 × 480 @ 60</text><text x="30" y="456" class="h">验收链</text><text x="30" y="484" class="t">独立直通参考 → v2 软件影子 / 完整 RTL → 板上同帧 CRC 与 PERF → 3600 场确认</text><text x="30" y="520" class="t">同位流 TEX：1891 / 2237　　条带 4KB：424 / 505　　16KB 候选：479 / 597</text><text x="30" y="550" class="s">顺序为 16×16 / 8×8；条带正确执行，但当前 CPU 构造成本主导；扫描欠载均为 0。</text></svg>