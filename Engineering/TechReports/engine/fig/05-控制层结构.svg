<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bi { fill:#f8fafc; stroke:#64748b; stroke-width:1 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .br { fill:#e0f2fe; stroke:#0369a1; stroke-width:1.2 }
      .bg { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.1; stroke-dasharray:5 4 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .tg { font-size:9.5px; fill:#94a3b8 }
      .ctl { stroke:#334155; stroke-width:1.4; fill:none }
      .bus { stroke:#334155; stroke-width:2.5; fill:none }
      .un  { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">控制层：APB 寄存器、命令取数与顺序提交</text>
  <text x="40" y="60" font-size="12" fill="#64748b">B5 已在 engine_top 内例化 B1～B4；图中虚线是 B6 才接入 SoC 顶层的 APB、AXI 与中断通路。</text>

  <rect x="1015" y="78" width="225" height="94" class="bi"/>
  <text x="1030" y="99" class="t" font-weight="600">图例</text>
  <rect x="1030" y="111" width="19" height="14" class="br"/>
  <text x="1059" y="123" class="ts">B5 本层实现</text>
  <line x1="1030" y1="143" x2="1080" y2="143" class="un" marker-end="url(#ag)"/>
  <text x="1090" y="147" class="ts">B6 顶层接入</text>

  <rect x="40" y="221" width="202" height="138" class="bg"/>
  <text x="56" y="245" class="tt">CPU / SoC APB</text>
  <text x="56" y="267" class="tg">B6 接入第 0 页</text>
  <text x="56" y="289" class="ts">LIST_BASE、LIST_COUNT、DOORBELL</text>
  <text x="56" y="307" class="ts">读 STATUS、ERROR 与 PERF</text>
  <text x="56" y="329" class="ts">中断 B 回到 SoC（B6）</text>
  <rect x="280" y="142" width="720" height="596" class="b"/>
  <text x="300" y="169" class="tt">engine_top　rtl/engine/engine_top.v（B5，已实现；B6 进整机网表）</text>
  <text x="300" y="189" class="ts">控制层把寄存器、命令处理、几何、像素与搬运层连成一个引擎；这里的连线已在 B5 仿真中验证。</text>
  <line x1="245" y1="282" x2="306" y2="282" class="un" marker-end="url(#ag)"/>
  <text x="255" y="271" class="ts">APB</text>

  <rect x="310" y="218" width="275" height="158" class="br"/>
  <text x="326" y="243" class="tt">engine_regs　APB 与状态</text>
  <text x="326" y="265" class="t">16 槽表面表、控制与错误三元组</text>
  <text x="326" y="285" class="ts">PERF 九个计数器；IRQ 写 1 清</text>
  <text x="326" y="305" class="ts">SOFT_RST 请求排空后才清状态</text>
  <text x="326" y="326" class="ts">I8：完成、错误、像素与总线事件汇入</text>
  <text x="326" y="347" class="ts">寄存器偏移由 regs_gen.py 统一生成</text>

  <rect x="610" y="218" width="360" height="158" class="br"/>
  <text x="626" y="243" class="tt">engine_cmd　命令取数与提交</text>
  <text x="626" y="265" class="t">整批取数、双半缓冲、下一批预取</text>
  <text x="626" y="285" class="ts">单拍组合十步检查；失败批逐条回退</text>
  <text x="626" y="305" class="ts">D52：前一条完成后才提交后一条结果</text>
  <text x="626" y="325" class="ts">D54：排空后才置 DONE / ERR</text>
  <text x="626" y="347" class="ts">非空 LIST_BASE 必须 32 字节对齐</text>
  <line x1="588" y1="284" x2="606" y2="284" class="ctl" marker-end="url(#a)"/>
  <text x="590" y="271" class="ts">配置</text>

  <rect x="310" y="486" width="660" height="216" class="bi"/>
  <text x="545" y="511" class="tt">B1～B4 执行通路（B5 已例化）</text>
  <polyline points="680,379 680,450 425,450 425,536" class="ctl" marker-end="url(#a)"/>
  <text x="520" y="443" class="ts">I1 命令与裁剪框</text>
  <line x1="848" y1="379" x2="848" y2="536" class="ctl" marker-end="url(#a)"/>
  <text x="856" y="445" class="ts">I7 取数 / 读状态 / 排空</text>
  <rect x="330" y="538" width="190" height="108" class="bx"/>
  <text x="344" y="562" class="tt">B3 engine_geom</text>
  <text x="344" y="583" class="ts">五者求交、逐行拆段</text>
  <text x="344" y="601" class="ts">空命令回 cmd_done</text>
  <text x="344" y="619" class="ts">末行写描述符带 wr_last_row</text>

  <rect x="545" y="538" width="190" height="108" class="bx"/>
  <text x="559" y="562" class="tt">B4 engine_pix + B1 blend</text>
  <text x="559" y="583" class="ts">两行片上缓存、四像素通路</text>
  <text x="559" y="601" class="ts">I3 收读流；I4 送写流</text>
  <text x="559" y="619" class="ts">色键与写掩码</text>

  <rect x="760" y="538" width="190" height="108" class="bx"/>
  <text x="774" y="562" class="tt">B2 engine_mover</text>
  <text x="774" y="583" class="ts">AXI 读写各一笔在途</text>
  <text x="774" y="601" class="ts">读侧仲裁、超时与排空</text>
  <text x="774" y="619" class="ts">W 通道带内掩码</text>

  <line x1="523" y1="590" x2="541" y2="590" class="ctl" marker-end="url(#a)"/>
  <text x="522" y="576" class="ts">I5</text>
  <line x1="738" y1="586" x2="756" y2="586" class="bus" marker-end="url(#a)"/>
  <line x1="757" y1="615" x2="739" y2="615" class="bus" marker-end="url(#a)"/>
  <text x="738" y="575" class="ts">I4</text>
  <text x="738" y="633" class="ts">I3</text>
  <polyline points="425,649 425,674 855,674 855,649" class="ctl" marker-end="url(#a)"/>
  <text x="600" y="669" class="ts">I2 读写描述符</text>

  <rect x="1040" y="524" width="200" height="128" class="bg"/>
  <text x="1056" y="548" class="tt">Axi_Mux S1 → DDR3</text>
  <text x="1056" y="570" class="tg">B6 接入</text>
  <text x="1056" y="590" class="ts">当前 S1 仍由探针主机占用</text>
  <text x="1056" y="610" class="ts">引擎 AXI 端口尚未上板</text>
  <line x1="1003" y1="590" x2="1036" y2="590" class="un" marker-end="url(#ag)"/>

  <text x="40" y="775" font-size="11" fill="#475569">B5 的单独综合与端到端仿真已经完成；整机资源、时序和真实引擎上板判据归 B6。</text>
</svg>
