<text x="1230" y="563" text-anchor="middle" font-size="19">现行 G1 bit + 新编 engineTest</text>
<text x="1230" y="603" text-anchor="middle" font-size="19">JTAG / UART / DDR 程序装载</text>
<text x="1230" y="646" text-anchor="middle" font-size="18">BAND 尚未上板，Flash 未改</text>
<text x="45" y="804" font-size="18">图例：黑框为现有通路；绿框为研究探针；实线为已接实验，粗线为数据；灰色虚线为待实施。</text>
</g>
