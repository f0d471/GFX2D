<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="890" viewBox="0 0 1450 890">
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/></marker>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b4d;font-size:18px}.title{font-size:27px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:16px}.old{fill:#eef5ff;stroke:#2563a6;stroke-width:2}.new{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 5}.link{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.future{stroke-dasharray:7 5}</style>
</defs>
<rect width="1450" height="890" fill="white"/>
<text x="40" y="44" class="title">绘制前端：状态、实例、空间引用与既有数据面</text>
<text x="40" y="76" class="small">决策的功能分层：蓝色实线框为已有能力，灰色虚线框为选定路线。箭头表示数据或完成依赖。</text>
<rect class="old" x="40" y="115" width="300" height="125"/>
<text class="head" x="60" y="150">应用 / 游戏逻辑</text><text x="60" y="182">确定画序、位置与图集坐标</text><text x="60" y="212">运动、碰撞、规则保留在 CPU</text>
<rect class="new" x="400" y="115" width="300" height="125"/>
<text class="head" x="420" y="150">共享 draw 状态 / 实例</text><text x="420" y="182">表面、方程、尺寸、clip epoch</text><text x="420" y="212">4 B XY / 8 B XYUV 数组</text>
<rect class="new" x="760" y="115" width="300" height="125"/>
<text class="head" x="780" y="150">DDR 帧资源与 lease</text><text x="780" y="182">输入 / 实例 / PB 分别归帧所有</text><text x="780" y="212">完成且排空后才允许复用</text>
<rect class="new" x="1120" y="115" width="260" height="125"/>
<text class="head" x="1140" y="150">F2 pass / 背景页</text><text x="1140" y="182">直通预合成与有效初值</text><text x="1140" y="212">完成之后才允许 LOAD</text>
<path class="link future" d="M340 177 H400"/><path class="link future" d="M700 177 H760"/>
<rect class="new" x="40" y="340" width="300" height="150"/>
<text class="head" x="60" y="375">F3 CPU 稳定分桶候选</text><text x="60" y="408">规范化 / 计数 → 小引用</text><text x="60" y="438">按桶连续物化 32 B 记录</text><text class="small" x="60" y="469">外部仍为原 ABI v2 定长表</text>
<rect class="new" x="400" y="340" width="300" height="150"/>
<text class="head" x="420" y="375">F4 通用实例展开</text><text x="420" y="408">一次包检查 / 按序取实例</text><text x="420" y="438">共享状态与坐标生成几何输入</text><text class="small" x="420" y="469">可先独立走直通像素路径</text>
<rect class="new" x="760" y="340" width="300" height="150"/>
<text class="head" x="780" y="375">F5 空间分桶 / 参数缓冲</text><text x="780" y="408">计数 → 区间分配 → 保序散布</text><text x="780" y="438">按条带保存保序 8 B 引用</text><text class="small" x="780" y="469">全部参数就绪后进入引用执行</text>
<rect class="new" x="1120" y="340" width="260" height="150"/>
<text class="head" x="1140" y="375">F5 引用解析与执行</text><text x="1140" y="408">引用 → 绘制状态 / 实例</text><text x="1140" y="438">恢复裁剪与原几何属性</text><text class="small" x="1140" y="469">每桶保持原输入相对序</text>
<path class="link future" d="M190 240 V340"/><path class="link future" d="M550 240 V340"/><path class="link future" d="M910 240 V340"/>
<path class="link future" d="M700 415 H760"/><path class="link future" d="M1060 415 H1120"/>
<rect class="old" x="40" y="635" width="300" height="125"/>
<text class="head" x="60" y="670">既有提交与执行入口</text><text x="60" y="702">三种既有路径继续保留</text><text x="60" y="732">原错误、完成与模式对照</text>
<rect class="old" x="400" y="635" width="300" height="125"/>
<text class="head" x="420" y="670">图元几何处理</text><text x="420" y="702">全帧坐标 → 交集 / 行工作</text><text x="420" y="732">按当前条带限定目的访问</text>
<rect class="old" x="760" y="635" width="300" height="125"/>
<text class="head" x="780" y="670">像素合成 / 纹理</text><text x="780" y="702">原混合方程、舍入与色键</text><text x="780" y="732">按行管理像素工作集</text>
<rect class="old" x="1120" y="635" width="260" height="125"/>
<text class="head" x="1140" y="670">条带缓存与搬运</text><text x="1140" y="702">装入 / 执行 / 写回</text><text x="1140" y="732">F6 条件启动搬运重叠</text>
<path class="link future" d="M190 490 V635"/><path class="link" d="M340 697 H400"/><path class="link" d="M700 697 H760"/><path class="link" d="M1060 697 H1120"/>
<path class="link future" d="M1250 490 V550 H550 V635"/><text class="small" x="720" y="540">PB_READY 后逐桶执行，原始图元只提交一次</text>
<path class="link future" d="M430 490 V590 H480 V635"/><text class="small" x="290" y="575">F4 直通</text>
<path class="link future" d="M1380 177 H1410 V590 H1250 V635"/><text class="small" x="1080" y="584">背景完成依赖</text>
<text x="40" y="812">采用门槛：同画面 / 同负载 / 同位流；计入全部 CPU、DDR、准备与空泡；两型 N_max 对同轮 TEX。</text>
<text x="40" y="844">扩展边界：保留 draw 状态、实例、保序空间引用与 fence；未来几何类型扩展需新版本和独立验证。</text>
</svg>
