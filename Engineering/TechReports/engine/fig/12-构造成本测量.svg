<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs>
<rect width="1280" height="700" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172554">
<text x="40" y="48" font-size="23">frontendBench：固定输入、生产构造与计时外消费</text>
<rect x="40" y="110" width="350" height="130" fill="#e8f1fb" stroke="#334155" stroke-width="1.5"/>
<text x="56" y="141" font-size="18">scene / stg_game</text>
<text x="56" y="170" font-size="14">两型 × 六个 K 档</text>
<text x="56" y="194" font-size="14">通关录像的五个固定状态</text>
<text x="56" y="218" font-size="14">同状态、同表面、同 clip</text>
<rect x="470" y="110" width="350" height="130" fill="#e8f1fb" stroke="#334155" stroke-width="1.5"/>
<text x="486" y="141" font-size="18">stg_game_compose</text>
<text x="486" y="170" font-size="14">真实 gfx_blit_run / gfx_fill</text>
<text x="486" y="194" font-size="14">board_cycles：100 MHz</text>
<text x="486" y="218" font-size="14">粗粒度阶段与细分诊断独立构建</text>
<rect x="900" y="110" width="340" height="130" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="916" y="141" font-size="18">gfx_list</text>
<text x="916" y="170" font-size="14">v1 连续表 / v2 32 KiB 桶</text>
<text x="916" y="194" font-size="14">planned / geometry 可单独启用</text>
<text x="916" y="218" font-size="14">END / seal 后才可消费</text>
<rect x="40" y="360" width="350" height="130" fill="#e8f1fb" stroke="#334155" stroke-width="1.5"/>
<text x="56" y="391" font-size="18">check_frontend.py</text>
<text x="56" y="420" font-size="14">三次各 1000 帧</text>
<text x="56" y="444" font-size="14">总周期、p50 / p99 / max</text>
<text x="56" y="468" font-size="14">缺组、错列、溢出、未 done 拒绝</text>
<rect x="470" y="360" width="350" height="130" fill="#e8f1fb" stroke="#334155" stroke-width="1.5"/>
<text x="486" y="391" font-size="18">frontend_consume</text>
<text x="486" y="420" font-size="14">独立编译单元，无 LTO</text>
<text x="486" y="444" font-size="14">读取全部有效记录的八个字段</text>
<text x="486" y="468" font-size="14">固定输入 CRC 与宿主 / RV32 对账</text>
<rect x="900" y="360" width="340" height="130" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="916" y="391" font-size="18">renderer_run / engine_top</text>
<text x="916" y="420" font-size="14">关闭渲染：隔离 CPU</text>
<text x="916" y="444" font-size="14">开启扫描和真实执行：计依赖</text>
<text x="916" y="468" font-size="14">PERF_BUSY 与墙钟分开登记</text>
<polyline points="390,175 470,175" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="157" font-size="14">调用</text>
<polyline points="820,175 900,175" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830" y="157" font-size="14">32 B 记录</text>
<polyline points="1070,240 1070,360" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1090" y="310" font-size="14">提交</text>
<polyline points="900,425 820,425" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="825" y="405" font-size="14">完成后消费</text>
<polyline points="470,425 390,425" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="395" y="405" font-size="14">原始日志</text>
<text x="40" y="570" font-size="15">计时区仅含被测构造；CRC、排序和日志输出均在区间之外。</text>
<text x="40" y="597" font-size="15">细分探针会扰动被测代码；阶段和总计的差额单列，不把细项相加当成生产帧时间。</text>
<rect x="40" y="660" width="18" height="15" fill="#e8f1fb" stroke="#334155"/>
<text x="68" y="673" font-size="13">蓝色：CPU 构造或检查</text>
<rect x="320" y="660" width="18" height="15" fill="#f1f5f9" stroke="#334155"/>
<text x="348" y="673" font-size="13">灰色：存储或引擎执行</text>
<text x="700" y="673" font-size="13">实线箭头：调用或数据依赖</text></g></svg>
