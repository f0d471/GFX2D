<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bi { fill:#f8fafc; stroke:#64748b; stroke-width:1 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .br { fill:#e0f2fe; stroke:#0369a1; stroke-width:1.2 }
      .bo { fill:#fffbeb; stroke:#b45309; stroke-width:1.2 }
      .bp { fill:#e2e8f0; stroke:#94a3b8; stroke-width:1 }
      .bt { fill:#fef3c7; stroke:#b45309; stroke-width:1 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .tg { font-size:9.5px; fill:#94a3b8 }
      .bmb { stroke:#334155; stroke-width:1.7; fill:none }
      .ob  { stroke:#b45309; stroke-width:1.5; fill:none; stroke-dasharray:5 3 }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="840" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">一行怎么变成描述符与边带：覆盖区间、相位与拆段</text>
  <text x="40" y="60" font-size="12" fill="#64748b">数字来自独立模型的定向用例：① ③ 用 base-mod4-only 的第 16 行（基址 0x00100004、x0 = 37、宽 13），② 用 row-cross-4k。</text>

  <!-- ① 覆盖区间 -->
  <rect x="40" y="82" width="1200" height="216" class="bi"/>
  <text x="56" y="104" class="t" font-weight="600">① 覆盖区间向外取整到 16 字节：下界的「前导」与上界的「尾部」里不属于本行的像素，由 D16 的带内标记不写</text>

  <text x="56" y="128" class="ts">a0 = dst_row &amp; ~15 = 0x00110090</text>
  <text x="330" y="128" class="ts">行首 = dst_row = 0x00110098（lead_dst = 2）</text>
  <text x="700" y="128" class="ts">a1 = (dst_row + nb + 15) &amp; ~15 = 0x001100D0</text>
  <text x="1080" y="128" class="ts">alen = 64 字节</text>

  <!-- 四个拍 -->
  <rect x="120" y="142" width="256" height="46" class="b"/>
  <rect x="376" y="142" width="256" height="46" class="b"/>
  <rect x="632" y="142" width="256" height="46" class="b"/>
  <rect x="888" y="142" width="256" height="46" class="b"/>

  <!-- 拍内的 4 个像素槽（先画底色，再画标签） -->
  <rect x="120" y="142" width="64" height="46" class="bp"/>
  <rect x="184" y="142" width="64" height="46" class="bp"/>
  <rect x="1080" y="142" width="64" height="46" class="bt"/>

  <text x="248" y="170" class="ts" text-anchor="middle">拍 0</text>
  <text x="504" y="170" class="ts" text-anchor="middle">拍 1</text>
  <text x="760" y="170" class="ts" text-anchor="middle">拍 2</text>
  <text x="1016" y="170" class="ts" text-anchor="middle">拍 3</text>

  <text x="152" y="170" class="tg" text-anchor="middle">填充</text>
  <text x="216" y="170" class="tg" text-anchor="middle">填充</text>
  <text x="1112" y="170" class="tg" text-anchor="middle">填充</text>

  <line x1="280" y1="188" x2="280" y2="206" class="bmb"/>
  <text x="280" y="218" class="ts" text-anchor="middle">本行第 0 个像素</text>
  <line x1="1048" y1="188" x2="1048" y2="206" class="bmb"/>
  <text x="1048" y="218" class="ts" text-anchor="middle">本行第 12 个像素（最后一个）</text>

  <line x1="120" y1="134" x2="120" y2="196" stroke="#b45309" stroke-width="1.2"/>
  <line x1="1144" y1="134" x2="1144" y2="196" stroke="#b45309" stroke-width="1.2"/>

  <text x="56" y="248" class="ts">覆盖区间 = a1 − a0 = 64 字节 = 4 拍；本行 13 个像素。首拍有 lead = 2 个填充像素，末拍有 3 个填充像素，2 + 4 + 4 + 3 = 13。</text>
  <text x="56" y="266" class="ts">写侧按像素清 wstrb（D16），读侧读到的填充像素被丢掉：覆盖区间可以越出本行，甚至越出表面，功能上无害。</text>
  <text x="56" y="284" class="tg">一行最多 640 像素 = 2560 字节，取整后最多 2576 = 161 拍，既小于 4096 也小于 192×16，所以一行最多两段、192 拍的上限在 P1 里永不触发。</text>

  <!-- ② 跨 4KB 拆段 -->
  <rect x="40" y="312" width="580" height="190" class="bi"/>
  <text x="56" y="334" class="t" font-weight="600">② 一行跨 4KB 时拆成两段（D3 规矩 1）</text>

  <rect x="120" y="352" width="111" height="44" class="bx"/>
  <rect x="231" y="352" width="889" height="44" class="bx"/>
  <text x="175" y="379" class="ts" text-anchor="middle">段 0：16 拍</text>
  <text x="675" y="379" class="ts" text-anchor="middle">段 1：128 拍</text>

  <line x1="231" y1="348" x2="231" y2="404" stroke="#b45309" stroke-width="1.4"/>
  <text x="231" y="346" class="ts" text-anchor="middle" fill="#b45309">4KB 边界</text>
  <text x="120" y="420" class="ts">0x100F00</text>
  <text x="1120" y="420" class="ts" text-anchor="end">0x101800</text>
  <text x="231" y="434" class="tg" text-anchor="middle">0x101000</text>

  <text x="56" y="444" class="ts">a0 = 0x100F00、alen = 2304 字节；page_left = 0x1000 − (a0 &amp; 0xFFF) = 0x100 = 16 拍。</text>
  <text x="56" y="462" class="ts">seg0 = min(alen, page_left, 192×16) = 256 字节；seg1 = alen − seg0 = 2048 字节。</text>
  <text x="56" y="480" class="tg">每一段各自是一笔突发：地址 16 字节对齐、不跨 4KB、不超过 192 拍，核内永不拆分。</text>

  <!-- ③ 相位 -->
  <rect x="650" y="312" width="590" height="190" class="bo"/>
  <text x="666" y="334" class="t" font-weight="600">③ lead 是行首地址的低 4 位除以 4，不是「x 对 4 的余数」（D36）</text>

  <text x="666" y="360" class="ts">dst_row = dst_base + (y &lt;&lt; dst_slog2) + (x0 &lt;&lt; 2)</text>
  <text x="666" y="378" class="ts">　　　　 = 0x00100004 + (16 &lt;&lt; 12) + (37 &lt;&lt; 2) = 0x00110098</text>
  <text x="666" y="400" class="ts" font-weight="600">lead_dst = (0x00110098 &amp; 15) &gt;&gt; 2 = 8 &gt;&gt; 2 = 2</text>
  <text x="666" y="420" class="ts">而 x0 mod 4 = 1：按「x 对 4 的余数」写会得到 1，按地址写得到 2。</text>
  <text x="666" y="444" class="ts">表面结构谓词只要求 base % 4 == 0，于是相位由 base、stride_log2、x 三者共同决定：</text>
  <text x="666" y="462" class="ts">dst_row &amp; 15 = ((dst_base &amp; 15) + (y &lt;&lt; dst_slog2) + (x0 &lt;&lt; 2)) &amp; 15</text>
  <text x="666" y="484" class="tg">base 按 16 字节对齐且 stride_log2 ≥ 4 时两者才相同；真实构图的帧缓冲与纹理恰好都是这样，所以要在定向用例里才看得出来。</text>

  <!-- ④ D7 -->
  <rect x="40" y="518" width="610" height="290" class="bi"/>
  <text x="56" y="540" class="t" font-weight="600">④ D7 读写避让：只有两条判定（D37）</text>
  <text x="56" y="560" class="ts">读源 ⟺ 操作是 BLIT　　读目的 ⟺ 方程不是 COPY</text>

  <text x="56" y="588" class="ts" font-weight="600">情形</text>
  <text x="260" y="588" class="ts" font-weight="600">省掉什么</text>
  <text x="400" y="588" class="ts" font-weight="600">为什么结果不变</text>
  <line x1="56" y1="596" x2="634" y2="596" stroke="#cbd5e1" stroke-width="1"/>

  <text x="56" y="616" class="ts">FILL 且方程 COPY</text>
  <text x="260" y="616" class="ts">读源、读目的</text>
  <text x="400" y="616" class="ts">常量源；COPY 不看目的</text>

  <text x="56" y="638" class="ts">BLIT 且方程 COPY</text>
  <text x="260" y="638" class="ts">读目的</text>
  <text x="400" y="638" class="ts">COPY 不看目的；色键命中走带内标记</text>

  <text x="56" y="660" class="ts">FILL 的其余五个方程</text>
  <text x="260" y="660" class="ts">读源</text>
  <text x="400" y="660" class="ts">常量源</text>

  <text x="56" y="682" class="ts">其余（BLIT 的 ALPHA、ADD…）</text>
  <text x="260" y="682" class="ts">不省</text>
  <text x="400" y="682" class="ts">都要读目的</text>

  <text x="56" y="712" class="ts">两组真实输入上的读数（独立模型）：</text>
  <text x="56" y="730" class="ts">159 条向量：几何层见到非空 54、空 5；108 行、230 个描述符（读源 60、读目的 62）</text>
  <text x="56" y="748" class="ts">十一整帧：非空 16、空 1；1956 行、3268 个描述符（读源 576、读目的 736）</text>
  <text x="56" y="766" class="ts">与软件执行器逐像素对照 59 + 17 条命令，违例 0</text>
  <text x="56" y="790" class="tg">注错位 2（值 4）把 ALPHA 也当成 COPY，读描述符少一半，测试台在「边带的读不读目的」上见红。</text>

  <!-- ⑤ 发出顺序与边带 -->
  <rect x="670" y="518" width="570" height="290" class="bi"/>
  <text x="686" y="540" class="t" font-weight="600">⑤ 一行的发出顺序与 I5 边带</text>

  <rect x="686" y="554" width="118" height="34" class="bx"/>
  <rect x="812" y="554" width="118" height="34" class="bx"/>
  <rect x="938" y="554" width="118" height="34" class="bx"/>
  <rect x="1064" y="554" width="118" height="34" class="bx"/>
  <text x="745" y="576" class="ts" text-anchor="middle">边带</text>
  <text x="871" y="576" class="ts" text-anchor="middle">读源</text>
  <text x="997" y="576" class="ts" text-anchor="middle">读目的</text>
  <text x="1123" y="576" class="ts" text-anchor="middle">写目的</text>
  <line x1="804" y1="571" x2="810" y2="571" class="bmb" marker-end="url(#a)"/>
  <line x1="930" y1="571" x2="936" y2="571" class="bmb" marker-end="url(#a)"/>
  <line x1="1056" y1="571" x2="1062" y2="571" class="bmb" marker-end="url(#a)"/>
  <text x="686" y="606" class="ts">边带先发：B4 在本行的数据回来之前就知道相位与首末拍掩码。</text>
  <text x="686" y="624" class="ts">读源、读目的按段各发一笔（跨 4KB 时两笔）；写目的同理。</text>

  <text x="686" y="654" class="ts" font-weight="600">I5 边带的字段</text>
  <line x1="686" y1="662" x2="1224" y2="662" stroke="#cbd5e1" stroke-width="1"/>
  <text x="686" y="680" class="ts">npx（11 位）　本行像素数 x1 − x0 + 1</text>
  <text x="686" y="698" class="ts">beats（8 位）　本行写拍数，两段之和</text>
  <text x="686" y="716" class="ts">lead_dst / lead_src（各 2 位）　行首地址的拍内像素相位</text>
  <text x="686" y="734" class="ts">方程、key、色键字、常量源字 w4、c、源格式</text>
  <text x="686" y="752" class="ts">这一行读不读目的（D7）　行号 py 供 B4 对账</text>
  <text x="686" y="776" class="tg">首末拍的有效像素由 lead 与 npx 算出——Amiga 是软件写掩码寄存器、硬件只 AND 到</text>
  <text x="686" y="792" class="tg">首末字上；本设计每像素 32 位、每拍 4 个，掩码天然退化成 4 位逐像素使能。</text>
</svg>
