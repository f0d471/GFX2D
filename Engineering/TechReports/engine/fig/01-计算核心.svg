<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400"
     role="img" aria-labelledby="title desc">
  <title id="title">engine_blend 单通道混合核的三级流水</title>
  <desc id="desc">源颜色、目的颜色、alpha、常量和方程号进入混合核。第一级选择因子并相乘，第二级求和，第三级舍入除以255并饱和，输出8位颜色。en统一控制三级寄存器推进。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; fill:#0f172a }
      .code { font-family:Consolas,"Courier New",monospace; font-size:20px }
      .heading { font-size:21px; font-weight:600 }
      .note { font-size:18px; fill:#64748b }
      .register { font-size:18px; fill:#1d4ed8 }
      .flow { stroke:#334155; stroke-width:2; marker-end:url(#arrow) }
    </style>
  </defs>

  <rect width="1280" height="400" fill="#fff"/>
  <rect x="20" y="20" width="1240" height="360" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="61" font-family="Consolas,monospace" font-size="28" font-weight="600">engine_blend</text>
  <text x="1236" y="60" text-anchor="end" font-size="21" fill="#475569">单通道混合 · 三级流水</text>
  <path d="M20 84 H1260 M20 330 H1260" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="44" y="126" class="heading">输入</text>
  <text x="44" y="184" class="code">src,dst [7:0]</text>
  <text x="44" y="216" class="code">a,c     [7:0]</text>
  <text x="44" y="248" class="code">eq      [2:0]</text>
  <path d="M216 212 H248" class="flow"/>

  <text x="390" y="126" text-anchor="middle" class="heading">第 1 级　选择与乘法</text>
  <text x="390" y="166" text-anchor="middle" class="note">eq 选择 base、m1、m2</text>
  <text x="390" y="205" text-anchor="middle" class="code">r_p ← m1 × m2</text>
  <text x="390" y="240" text-anchor="middle" class="code">r_c ← base × 255</text>
  <rect x="260" y="274" width="260" height="36" fill="#eff6ff"/>
  <text x="390" y="298" text-anchor="middle" class="register">寄存：r_p、r_c</text>
  <path d="M524 212 H558" class="flow"/>

  <text x="665" y="126" text-anchor="middle" class="heading">第 2 级　求和</text>
  <text x="665" y="216" text-anchor="middle" class="code" style="font-size:18px">r_x ← r_p + r_c</text>
  <rect x="570" y="274" width="190" height="36" fill="#eff6ff"/>
  <text x="665" y="298" text-anchor="middle" class="register">寄存：r_x</text>
  <path d="M764 212 H798" class="flow"/>

  <text x="940" y="126" text-anchor="middle" class="heading">第 3 级　舍入与饱和</text>
  <text x="940" y="195" text-anchor="middle" font-size="21">r_x 舍入除以 255</text>
  <text x="940" y="231" text-anchor="middle" font-size="21">结果饱和到 255</text>
  <rect x="810" y="274" width="260" height="36" fill="#eff6ff"/>
  <text x="940" y="298" text-anchor="middle" class="register">寄存：out</text>
  <path d="M1074 212 H1122" class="flow"/>
  <text x="1140" y="218" class="code">out[7:0]</text>

  <text x="640" y="361" text-anchor="middle" font-size="19">clk 上升沿：en = 1 时三级推进，en = 0 时三级保持</text>
</svg>
