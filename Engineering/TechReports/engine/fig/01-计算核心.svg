<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bi { fill:#f8fafc; stroke:#64748b; stroke-width:1 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .br { fill:#e0f2fe; stroke:#0369a1; stroke-width:1.2 }
      .bg { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.1; stroke-dasharray:5 4 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .tg { font-size:9.5px; fill:#94a3b8 }
      .bmb { stroke:#334155; stroke-width:1.7; fill:none }
      .un  { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">计算核心：层间契约 I6 与内部三级</text>
  <text x="40" y="60" font-size="12" fill="#64748b">B1 定下的一层。左侧的调用方 B4 尚未实现；L、en 与「输入由寄存器驱动」都是 I6 的一部分。</text>

  <!-- 图例 -->
  <rect x="880" y="76" width="320" height="96" class="bi"/>
  <text x="896" y="96" class="t" font-weight="600">图例</text>
  <line x1="896" y1="116" x2="948" y2="116" class="bmb" marker-end="url(#a)"/>
  <text x="958" y="120" class="ts">数据流（已实现）</text>
  <line x1="896" y1="138" x2="948" y2="138" class="un" marker-end="url(#ag)"/>
  <text x="958" y="142" class="ts">尚未实现</text>
  <rect x="896" y="152" width="52" height="13" class="br"/>
  <text x="958" y="163" class="ts">流水寄存器</text>

  <!-- 左：B4（尚未实现） -->
  <rect x="40" y="190" width="250" height="300" class="bg"/>
  <text x="56" y="214" class="tt">B4 的 engine_pix</text>
  <text x="56" y="234" class="tg">尚未实现（引擎 P1 的第四批）</text>
  <line x1="56" y1="246" x2="274" y2="246" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="270" class="ts">把 12 个实例并起来：</text>
  <text x="56" y="290" class="ts">4 个像素 × 3 个通道</text>
  <text x="56" y="310" class="ts">每拍 4 像素，128 位一拍</text>
  <text x="56" y="346" class="ts">它负责：源行与目的行缓冲、</text>
  <text x="56" y="366" class="ts">像素旋转器、色键比较、</text>
  <text x="56" y="386" class="ts">写回选择</text>
  <text x="56" y="422" class="ts">五个输入由它这一侧的</text>
  <text x="56" y="442" class="ts">寄存器直接驱动</text>

  <!-- 接口箭头 -->
  <line x1="290" y1="340" x2="344" y2="340" class="un" marker-end="url(#ag)"/>
  <text x="296" y="330" class="ts">I6</text>

  <!-- 模块边界 -->
  <rect x="330" y="190" width="800" height="300" class="b"/>
  <text x="346" y="214" class="tt">engine_blend　rtl/engine/engine_blend.v（B1，已实现）</text>

  <!-- 级 1 -->
  <rect x="350" y="250" width="230" height="110" class="bx"/>
  <text x="364" y="272" class="t" font-weight="600">级 1　判定 + 乘 + base×255</text>
  <text x="364" y="296" class="ts">case(eq) 选 base / m1 / m2</text>
  <text x="364" y="316" class="ts">9 位有符号相乘：EFX_DSP48 ×1</text>
  <text x="364" y="336" class="ts">(base &lt;&lt; 8) − base 移位相减</text>

  <!-- 寄存器 r_p / r_c -->
  <rect x="590" y="250" width="56" height="110" class="br"/>
  <text x="598" y="296" class="ts">r_p</text>
  <text x="598" y="314" class="ts">r_c</text>
  <text x="598" y="342" class="tg">18 位</text>

  <!-- 级 2 -->
  <rect x="656" y="250" width="150" height="110" class="bx"/>
  <text x="670" y="272" class="t" font-weight="600">级 2</text>
  <text x="670" y="296" class="ts">x = r_p + r_c</text>
  <text x="670" y="316" class="ts">19 位有符号</text>

  <!-- 寄存器 r_x -->
  <rect x="816" y="250" width="50" height="110" class="br"/>
  <text x="824" y="304" class="ts">r_x</text>
  <text x="824" y="322" class="tg">19 位</text>

  <!-- 级 3 -->
  <rect x="876" y="250" width="190" height="110" class="bx"/>
  <text x="890" y="272" class="t" font-weight="600">级 3</text>
  <text x="890" y="296" class="ts">t = x + 128</text>
  <text x="890" y="316" class="ts">(t + (t &gt;&gt; 8)) &gt;&gt; 8</text>
  <text x="890" y="336" class="ts">min(255, q)</text>

  <!-- 寄存器 out -->
  <rect x="1076" y="250" width="44" height="110" class="br"/>
  <text x="1082" y="304" class="ts">out</text>
  <text x="1082" y="322" class="tg">8 位</text>

  <!-- 级间箭头 -->
  <line x1="580" y1="305" x2="586" y2="305" class="bmb"/>
  <line x1="646" y1="305" x2="652" y2="305" class="bmb"/>
  <line x1="806" y1="305" x2="812" y2="305" class="bmb"/>
  <line x1="866" y1="305" x2="872" y2="305" class="bmb"/>
  <line x1="1066" y1="305" x2="1072" y2="305" class="bmb"/>
  <line x1="1120" y1="305" x2="1186" y2="305" class="bmb" marker-end="url(#a)"/>
  <text x="1126" y="296" class="ts">out[7:0]</text>

  <!-- I6 约定 -->
  <rect x="350" y="382" width="760" height="80" class="bi"/>
  <text x="364" y="403" class="t" font-weight="600">I6（engine 第 00 章）</text>
  <text x="364" y="425" class="ts">clk：core_clk 100 MHz，与 SoC、DDR3 控制器同域　　en：时钟使能，B4 不用时接 1'b1</text>
  <text x="364" y="445" class="ts">src[7:0]　dst[7:0]　a[7:0]　c[7:0]　eq[2:0]　→　out[7:0]　固定延迟 L = 3 拍</text>

  <!-- 底部左：代入表 -->
  <rect x="40" y="510" width="520" height="180" class="bi"/>
  <text x="56" y="534" class="t" font-weight="600">六个方程共用一条通路</text>
  <text x="56" y="558" class="ts">x = base × 255 + m1 × m2，与 src × Fs + dst × Fd 逐位相同</text>
  <text x="56" y="584" class="ts">COPY　　　　　base=src　　　m1=0　　　　　m2=0</text>
  <text x="56" y="604" class="ts">ALPHA 预乘　　base=src　　　m1=dst　　　　m2=255−a</text>
  <text x="56" y="624" class="ts">ADD　　　　　 base=src+dst　m1=0　　　　　m2=0</text>
  <text x="56" y="644" class="ts">CONST　　　　 base=dst　　　m1=src−dst　　m2=c</text>
  <text x="56" y="664" class="ts">MUL　　　　　 base=0　　　　m1=src　　　　m2=dst</text>
  <text x="56" y="684" class="ts">ALPHA 非预乘　base=dst　　　m1=src−dst　　m2=a</text>

  <!-- 底部右：位宽 -->
  <rect x="590" y="510" width="540" height="180" class="bi"/>
  <text x="606" y="534" class="t" font-weight="600">位宽与符号（由实测取值范围定下）</text>
  <text x="606" y="558" class="ts">base　　　9 位无符号　　0 ~ 510</text>
  <text x="606" y="578" class="ts">m1　　　　9 位有符号　　−255 ~ 255</text>
  <text x="606" y="598" class="ts">m2　　　　8 位无符号　　0 ~ 255（进乘法器前零扩展成 9 位有符号）</text>
  <text x="606" y="618" class="ts">p　　　　 18 位有符号　　−65025 ~ 65025</text>
  <text x="606" y="638" class="ts">base×255　17 位无符号　0 ~ 130050</text>
  <text x="606" y="658" class="ts">x　　　　 17 位无符号　　0 ~ 130050（2^17 = 131072）</text>
  <text x="606" y="678" class="ts">t　　　　 18 位无符号　　0 ~ 130178</text>
</svg>
