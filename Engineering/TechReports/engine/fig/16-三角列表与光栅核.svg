<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#202020"/></marker>
  <marker id="future" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#777"/></marker>
</defs>
<rect width="1120" height="640" fill="white"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#202020" font-size="16">
  <text x="40" y="34" font-size="22">R2 单元连接：取数、光栅与片上条带</text>
  <g fill="white" stroke="#202020" stroke-width="1.5">
    <rect x="40" y="248" width="180" height="152"/>
    <rect x="280" y="248" width="210" height="152"/>
    <rect x="280" y="70" width="210" height="126"/>
    <rect x="575" y="70" width="250" height="208"/>
    <rect x="895" y="105" width="180" height="145"/>
    <rect x="575" y="370" width="250" height="128"/>
  </g>
  <text x="61" y="279">axi_ram_model</text>
  <text x="61" y="313">主表：128B / 记录</text>
  <text x="61" y="342">30 段子表</text>
  <text x="61" y="371">背景 / 目的条带</text>
  <text x="298" y="279">engine_mover</text>
  <text x="298" y="313">axi_dma_rd / wr</text>
  <text x="298" y="342">FD owner：CMD / INST</text>
  <text x="298" y="371">/ RAST，状态 + 末拍</text>
  <text x="300" y="102">engine_rlst</text>
  <text x="300" y="134">u16 FIFO × 64</text>
  <text x="300" y="167">片段 / 条带 / ordinal</text>
  <text x="595" y="102">engine_rast</text>
  <text x="595" y="133">参数槽 × 2 / signed48</text>
  <text x="595" y="164">固定延迟返回 → FIFO8</text>
  <text x="595" y="195">调制 → 色/z 同拍提交</text>
  <text x="595" y="225">z：4 bank ×</text>
  <text x="595" y="252">(2048+512) × 16b</text>
  <text x="913" y="137">engine_tex</text>
  <text x="913" y="170">4 × 1024 × 32b</text>
  <text x="913" y="202">L = 1 / 2</text>
  <text x="913" y="231">旧流 / 采样交接</text>
  <text x="595" y="403">engine_band</text>
  <text x="595" y="434">640 × 16 × 32b</text>
  <text x="595" y="465">pix14 → word / lane</text>
  <g fill="none" stroke="#202020" marker-end="url(#arrow)">
    <path d="M220 325 H280" stroke-width="3.5" marker-start="url(#arrow)"/>
    <path d="M350 248 V196" stroke-width="3.5"/>
    <path d="M425 196 V248" stroke-width="1.2"/>
    <path d="M490 130 H575" stroke-width="3.5"/>
    <path d="M575 175 H490" stroke-width="1.2"/>
    <path d="M825 145 H895" stroke-width="1.8"/>
    <path d="M895 215 H825" stroke-width="2.2"/>
    <path d="M700 278 V370" stroke-width="2.2"/>
    <path d="M385 400 V454 H575" stroke-width="3.5" marker-start="url(#arrow)"/>
  </g>
  <text x="227" y="306" font-size="13">AXI128</text>
  <text x="286" y="225" font-size="13">FS128</text>
  <text x="432" y="225" font-size="13">FD</text>
  <text x="500" y="113" font-size="13">RP128</text>
  <text x="500" y="195" font-size="13">rp_free</text>
  <text x="837" y="129" font-size="12">word12</text>
  <text x="837" y="237" font-size="12">data32</text>
  <text x="713" y="316" font-size="14">valid / ready</text>
  <text x="713" y="341" font-size="14">pix14 / data32</text>
  <text x="407" y="442" font-size="14">LOAD / FLUSH 128b</text>
  <rect x="895" y="370" width="180" height="128" fill="white" stroke="#777" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="912" y="403" fill="#777">engine_top</text>
  <text x="912" y="435" fill="#777">三维帧调度 / CSR</text>
  <text x="912" y="466" fill="#777">R3 待接入</text>
  <g fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#future)">
    <path d="M895 410 H825"/>
    <path d="M985 370 V298 H785 V278"/>
  </g>
  <text x="837" y="390" font-size="12" fill="#777">租约</text>
  <text x="875" y="286" font-size="13" fill="#777">clear / cancel</text>
  <text x="40" y="540">实线连接由单元测试台驱动；生产 B0～B6 不包含三维取数与光栅模块。</text>
  <g stroke="#202020" fill="none"><path d="M40 580 H94" stroke-width="3.5"/><path d="M260 580 H314" stroke-width="1.2"/></g>
  <path d="M510 580 H564" stroke="#777" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="108" y="586" font-size="14">128b 数据总线</text>
  <text x="328" y="586" font-size="14">请求 / 控制 / 窄数据</text>
  <text x="578" y="586" font-size="14" fill="#777">灰虚线：尚未接入的生产控制</text>
</g>
