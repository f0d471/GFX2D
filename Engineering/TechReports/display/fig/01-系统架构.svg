<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bi { fill:#f8fafc; stroke:#64748b; stroke-width:1 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .bo { fill:#fffbeb; stroke:#b45309; stroke-width:1.3 }
      .bt { fill:#f0fdfa; stroke:#0f766e; stroke-width:1.3 }
      .bd { fill:none;    stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:7 5 }
      .bg { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.1; stroke-dasharray:5 4 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .tg { font-size:9.5px; fill:#94a3b8 }
      .axi { stroke:#1d4ed8; stroke-width:2.4; fill:none }
      .apb { stroke:#334155; stroke-width:1.7; fill:none }
      .cdc { stroke:#b45309; stroke-width:1.5; fill:none; stroke-dasharray:5 3 }
      .un  { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
      .vid { stroke:#0f766e; stroke-width:2.0; fill:none }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">扫描输出接入后的系统：一条读通路、两个时钟域、四个跨域通道</text>
  <text x="40" y="60" font-size="12" fill="#64748b">2026-09-20 的比特流（Efinity 四步 PASS）。实例名取自 rtl/top/gfx2d_top.v；DDR3、Axi_Mux、SoC 与第 06 章相同，本章替换的是 S0 上的主机。</text>

  <!-- 图例 -->
  <rect x="866" y="78" width="334" height="152" class="bi"/>
  <text x="882" y="97" class="t" font-weight="600">图例</text>
  <line x1="882" y1="115" x2="934" y2="115" class="axi" marker-end="url(#ab)"/>
  <text x="944" y="119" class="ts">AXI4 读，128 位，S0 只读、在途一笔</text>
  <line x1="882" y1="135" x2="934" y2="135" class="axi" marker-end="url(#ab)"/>
  <text x="944" y="139" class="ts">AXI4：S1 探针（将来是引擎）、S2 SoC</text>
  <line x1="882" y1="155" x2="934" y2="155" class="apb" marker-end="url(#a)"/>
  <text x="944" y="159" class="ts">APB 寄存器：CPU 配置与回读</text>
  <line x1="882" y1="175" x2="934" y2="175" class="cdc" marker-end="url(#ao)"/>
  <text x="944" y="179" class="ts">跨域握手：toggle 或电平，两级同步</text>
  <line x1="882" y1="195" x2="934" y2="195" class="vid" marker-end="url(#ap)"/>
  <text x="944" y="199" class="ts">像素与行场同步：24 位 + 3 位</text>
  <line x1="882" y1="215" x2="934" y2="215" class="un" marker-end="url(#ag)"/>
  <text x="944" y="219" class="ts">已生成、未接入（灰色虚线）</text>

  <!-- 时钟域 -->
  <rect x="40" y="100" width="600" height="28" class="bi"/>
  <text x="54" y="119" class="ts">core_clk 域：100MHz（PLL_TL0，25MHz 晶振）　SoC、DDR3 控制器、Axi_Mux、display_fetch</text>
  <rect x="700" y="100" width="500" height="28" class="bi"/>
  <text x="714" y="119" class="ts">hdmi_tx_slow_clk 域：39.683ns（PLL_BL0，27MHz 晶振）　display_out 的像素侧、hdmi_tx</text>
  <line x1="670" y1="96" x2="670" y2="640" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- DDR3 -->
  <rect x="40" y="300" width="180" height="150" class="b"/>
  <text x="130" y="322" class="t" text-anchor="middle" font-weight="600">u_ddr3</text>
  <text x="130" y="340" class="ts" text-anchor="middle">DDR3 控制器</text>
  <text x="130" y="357" class="ts" text-anchor="middle">AXI 地址 28 位</text>
  <text x="130" y="373" class="ts" text-anchor="middle">128 位数据，ID 4 位</text>
  <text x="130" y="389" class="ts" text-anchor="middle">256MB，BURST_MODE=8</text>
  <text x="130" y="409" class="ts" text-anchor="middle">帧缓冲 0：0x0200_0000</text>
  <text x="130" y="425" class="ts" text-anchor="middle">帧缓冲 1：0x0240_0000</text>
  <text x="130" y="441" class="tg" text-anchor="middle">行跨 4096 字节</text>

  <!-- Axi_Mux -->
  <rect x="252" y="208" width="188" height="330" class="b"/>
  <text x="346" y="230" class="t" text-anchor="middle" font-weight="600">u_axi_mux</text>
  <text x="346" y="247" class="ts" text-anchor="middle">Axi_Mux，X3，一个出口</text>

  <rect x="268" y="262" width="156" height="70" class="bo"/>
  <text x="346" y="282" class="t" text-anchor="middle" font-weight="600">S0</text>
  <text x="346" y="299" class="ts" text-anchor="middle">u_display</text>
  <text x="346" y="316" class="ts" text-anchor="middle">只读，arlen=159</text>

  <rect x="268" y="344" width="156" height="70" class="bg"/>
  <text x="346" y="364" class="t" text-anchor="middle">S1</text>
  <text x="346" y="381" class="ts" text-anchor="middle">u_axi_probe（未改）</text>
  <text x="346" y="398" class="ts" text-anchor="middle">将来是引擎</text>

  <rect x="268" y="426" width="156" height="70" class="bx"/>
  <text x="346" y="446" class="t" text-anchor="middle">S2</text>
  <text x="346" y="463" class="ts" text-anchor="middle">u_soc（VexRiscv）</text>
  <text x="346" y="480" class="ts" text-anchor="middle">由 guard 保护</text>

  <text x="346" y="516" class="tg" text-anchor="middle">Cfg_Arb_Type / Cfg_Cnl_Mask</text>

  <!-- guard -->
  <rect x="252" y="530" width="188" height="64" class="bi"/>
  <text x="346" y="552" class="t" text-anchor="middle" font-weight="600">u_mux_guard</text>
  <text x="346" y="569" class="ts" text-anchor="middle">APB 0xF810_F000，V2</text>
  <text x="346" y="585" class="ts" text-anchor="middle">监视 S2 超龄，屏蔽 S1</text>

  <!-- u_display 容器 -->
  <rect x="468" y="176" width="520" height="430" class="bd"/>
  <text x="482" y="196" class="t" font-weight="600">u_display（display_top）</text>
  <text x="482" y="212" class="ts">对顶层露：APB 从口、AXI 读主机口、中断、给 hdmi_tx 的像素与同步</text>

  <!-- u_fetch -->
  <rect x="482" y="228" width="168" height="186" class="b"/>
  <text x="566" y="248" class="t" text-anchor="middle" font-weight="600">u_fetch</text>
  <text x="566" y="264" class="ts" text-anchor="middle">display_fetch，core_clk</text>
  <text x="566" y="284" class="ts" text-anchor="middle">一行 160 拍，在途一笔</text>
  <text x="566" y="300" class="ts" text-anchor="middle">空位 &#8805; 160 才发行</text>
  <text x="566" y="316" class="ts" text-anchor="middle">base + (row &lt;&lt; 12)</text>
  <text x="566" y="336" class="ts" text-anchor="middle">场起始清空六步</text>
  <text x="566" y="352" class="ts" text-anchor="middle">APB 26 个寄存器</text>
  <text x="566" y="368" class="ts" text-anchor="middle">最大值与三组直方图</text>
  <text x="566" y="390" class="tg" text-anchor="middle">INJECT=0（仿真注错口）</text>

  <!-- u_fifo（跨在时钟边界上） -->
  <rect x="658" y="228" width="152" height="152" class="bt"/>
  <text x="734" y="248" class="t" text-anchor="middle" font-weight="600">u_fifo</text>
  <text x="734" y="264" class="ts" text-anchor="middle">display_fifo</text>
  <text x="734" y="281" class="ts" text-anchor="middle">128 位 &#215; 512 深</text>
  <text x="734" y="297" class="ts" text-anchor="middle">OUTPUT_REG=0</text>
  <text x="734" y="313" class="ts" text-anchor="middle">写侧水位偏高</text>
  <text x="734" y="329" class="ts" text-anchor="middle">读侧水位偏低</text>
  <text x="734" y="345" class="ts" text-anchor="middle">rst_busy 同步后给出</text>
  <text x="734" y="366" class="tg" text-anchor="middle">厂商源码封装</text>

  <!-- u_out -->
  <rect x="826" y="228" width="148" height="186" class="b"/>
  <text x="900" y="248" class="t" text-anchor="middle" font-weight="600">u_out</text>
  <text x="900" y="264" class="ts" text-anchor="middle">display_out，像素时钟</text>
  <text x="900" y="284" class="ts" text-anchor="middle">唯一时序发生器</text>
  <text x="900" y="300" class="ts" text-anchor="middle">color_bar_rgb</text>
  <text x="900" y="320" class="ts" text-anchor="middle">rd_en = de0 &amp; psel==0</text>
  <text x="900" y="336" class="ts" text-anchor="middle">hs/vs/de 延迟一拍</text>
  <text x="900" y="352" class="ts" text-anchor="middle">最低水位、触底、欠载</text>
  <text x="900" y="368" class="ts" text-anchor="middle">帧快照 toggle/ack</text>
  <text x="900" y="390" class="tg" text-anchor="middle">计量窗口 = V_ACTIVE-4 行</text>

  <!-- 跨域握手通道（走廊在 u_fifo 下方） -->
  <path d="M 620 414 L 620 452 L 900 452 L 900 418" class="cdc" marker-end="url(#ao)"/>
  <text x="760" y="446" class="ts" text-anchor="middle">场起始 toggle、快照 toggle/ack、src_sel、clear_toggle</text>

  <!-- hdmi_tx -->
  <rect x="1012" y="228" width="140" height="186" class="b"/>
  <text x="1082" y="248" class="t" text-anchor="middle" font-weight="600">u_hdmi_tx</text>
  <text x="1082" y="264" class="ts" text-anchor="middle">纯编码封装</text>
  <text x="1082" y="281" class="ts" text-anchor="middle">复位同步 vid_rst_n</text>
  <text x="1082" y="297" class="ts" text-anchor="middle">dvi_encoder</text>
  <text x="1082" y="313" class="ts" text-anchor="middle">（官方文件）</text>
  <text x="1082" y="329" class="ts" text-anchor="middle">板上 P/N 取反</text>
  <text x="1082" y="349" class="ts" text-anchor="middle">vid_rgb[23:0]</text>
  <text x="1082" y="365" class="ts" text-anchor="middle">vid_hs/vs/de</text>
  <text x="1082" y="387" class="tg" text-anchor="middle">行场参数表不再使用</text>

  <!-- LVDS -->
  <rect x="1012" y="440" width="140" height="110" class="bi"/>
  <text x="1082" y="460" class="t" text-anchor="middle" font-weight="600">LVDS TX</text>
  <text x="1082" y="477" class="ts" text-anchor="middle">4 路 &#215; 10 位</text>
  <text x="1082" y="493" class="ts" text-anchor="middle">tmds_tx_data0/1/2</text>
  <text x="1082" y="509" class="ts" text-anchor="middle">tmds_tx_clk</text>
  <text x="1082" y="531" class="ts" text-anchor="middle">640&#215;480@60</text>

  <!-- 连线：mux -> DDR3 -->
  <line x1="252" y1="375" x2="224" y2="375" class="axi" marker-end="url(#ab)"/>
  <text x="238" y="367" class="ts" text-anchor="middle">128 位</text>

  <!-- 连线：S0 <-> fetch -->
  <line x1="440" y1="278" x2="478" y2="266" class="axi" marker-end="url(#ab)"/>
  <text x="456" y="262" class="ts" text-anchor="middle">AR</text>
  <line x1="478" y1="296" x2="440" y2="308" class="axi" marker-end="url(#ab)"/>
  <text x="456" y="320" class="ts" text-anchor="middle">R</text>

  <!-- 连线：fetch -> fifo -> out -->
  <line x1="650" y1="280" x2="654" y2="280" class="axi" marker-end="url(#ab)"/>
  <text x="652" y="272" class="tg" text-anchor="middle">128</text>
  <line x1="810" y1="280" x2="822" y2="280" class="axi" marker-end="url(#ab)"/>
  <text x="816" y="272" class="tg" text-anchor="middle">128</text>

  <!-- 连线：out -> hdmi_tx -->
  <line x1="974" y1="280" x2="1008" y2="280" class="vid" marker-end="url(#ap)"/>
  <text x="991" y="272" class="ts" text-anchor="middle">像素</text>

  <!-- 连线：hdmi_tx -> LVDS -->
  <line x1="1082" y1="414" x2="1082" y2="436" class="vid" marker-end="url(#ap)"/>
  <text x="1128" y="430" class="ts" text-anchor="middle">4&#215;10 位</text>

  <!-- 连线：vid_rst_n 回像素侧 -->
  <path d="M 1012 400 L 990 400 L 990 428 L 900 428" class="cdc" marker-end="url(#ao)"/>
  <text x="962" y="422" class="ts" text-anchor="middle">vid_rst_n</text>

  <!-- 未接入 -->
  <rect x="1012" y="580" width="140" height="60" class="bg"/>
  <text x="1082" y="600" class="t" text-anchor="middle">userInterruptB/C</text>
  <text x="1082" y="617" class="ts" text-anchor="middle">引擎与摄像头</text>
  <text x="1082" y="632" class="ts" text-anchor="middle">未接入</text>
  <path d="M 566 414 L 566 610 L 1008 610" class="un" marker-end="url(#ag)"/>
  <text x="834" y="604" class="ts" text-anchor="middle">场起始中断 → userInterruptA（中断号 16，电平）</text>

  <!-- APB -->
  <rect x="40" y="664" width="1160" height="96" class="bi"/>
  <text x="56" y="684" class="t" font-weight="600">APB Slave 0（CPU 地址 0xF810_0000 起，按 paddr[15:12] 分成四格；本章用的是第三格）</text>
  <rect x="60" y="694" width="250" height="28" class="bx"/>
  <text x="185" y="713" class="ts" text-anchor="middle">u_apb_probe　0x0000~0x0FFF　"GFX2"</text>
  <rect x="322" y="694" width="250" height="28" class="bx"/>
  <text x="447" y="713" class="ts" text-anchor="middle">u_axi_probe　0x1000~0x1FFF</text>
  <rect x="584" y="694" width="300" height="28" class="bo"/>
  <text x="734" y="713" class="ts" text-anchor="middle">u_display　0xE000~0xEFFF　"DISP" V1</text>
  <rect x="896" y="694" width="284" height="28" class="bx"/>
  <text x="1038" y="713" class="ts" text-anchor="middle">u_mux_guard　0xF000~0xFFFF　V2</text>
  <line x1="734" y1="694" x2="734" y2="640" class="apb" marker-end="url(#a)"/>
  <text x="748" y="660" class="ts">APB 配置与回读：CTRL / FRONT_BASE / 统计 / 快照 / 中断</text>
</svg>
