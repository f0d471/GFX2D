  <text x="805" y="798" class="ts" text-anchor="middle">10:1 串行化</text>
  <path d="M688,786 H730" class="io" marker-end="url(#a)"/>

  <rect x="1010" y="755" width="190" height="62" class="bx"/>
  <text x="1105" y="778" class="t" text-anchor="middle">HDMI 连接器</text>
  <text x="1105" y="796" class="ts" text-anchor="middle">显示器 640x480@60</text>
  <path d="M880,786 H1010" class="io" marker-end="url(#a)"/>
  <text x="940" y="778" class="ts">TMDS</text>

  <rect x="200" y="848" width="1000" height="56" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
