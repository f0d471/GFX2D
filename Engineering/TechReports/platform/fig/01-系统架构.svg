  <text x="107" y="382" class="ts" text-anchor="middle">ch2  UART · COM11</text>
  <text x="107" y="404" class="ts" text-anchor="middle">ch0 / ch3 板上未连接</text>

  <path d="M175,357 H192 V259 H215" class="io" marker-end="url(#a)"/>
  <path d="M175,378 H198 V452 H215" class="io" marker-start="url(#a)" marker-end="url(#a)"/>

