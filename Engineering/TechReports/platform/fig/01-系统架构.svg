  <text x="680" y="566" class="tu" text-anchor="middle">控制寄存器挂同一条 APB</text>
  <text x="680" y="584" class="tu" text-anchor="middle">数据口与 SoC 共用 DDR3</text>
  <path d="M680,500 V470" class="un" marker-end="url(#ag)"/>

