  <text x="305" y="257" class="t" text-anchor="middle">jtag_inst1（JTAG_USER1）</text>
  <text x="305" y="271" class="ts" text-anchor="middle">OpenOCD 调试通路</text>
  <path d="M305,278 V285" class="io" marker-end="url(#a)"/>

  <rect x="410" y="240" width="90" height="38" class="b"/>
  <text x="455" y="257" class="t" text-anchor="middle">复位生成</text>
  <text x="455" y="271" class="ts" text-anchor="middle">锁定后延时 3 ms</text>
