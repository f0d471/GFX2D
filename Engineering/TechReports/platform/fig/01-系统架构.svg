  <text x="622" y="798" class="ts" text-anchor="middle">板上差分对调</text>
  <path d="M375,786 H387" class="io" marker-end="url(#a)"/>
  <path d="M545,786 H557" class="io" marker-end="url(#a)"/>

  <rect x="730" y="762" width="150" height="48" class="b"/>
