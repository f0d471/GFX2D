<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bi { fill:#f8fafc; stroke:#64748b; stroke-width:1 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .bg { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.1; stroke-dasharray:5 4 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .tu { font-size:10px; fill:#64748b }
      .axi { stroke:#1d4ed8; stroke-width:2.4; fill:none }
      .apb { stroke:#334155; stroke-width:1.7; fill:none }
      .io  { stroke:#334155; stroke-width:1.1; fill:none }
      .clk { stroke:#b45309; stroke-width:1.3; fill:none; stroke-dasharray:6 3 }
      .un  { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">gfx2d 硬件基线的系统组成</text>
  <text x="40" y="60" font-size="12" fill="#64748b">钛金 Ti60F225，Efinity 2026.1 编译，2026-09-16 上板验证。灰色虚线为 IP 已生成、当前未接入的接口。</text>

  <rect x="200" y="95" width="760" height="735" rx="6" fill="#fcfdff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="212" y="115" class="tt">Ti60F225（60K 逻辑单元，256 块片上 RAM，160 个 DSP）</text>

  <rect x="250" y="128" width="210" height="62" class="b"/>
  <text x="355" y="150" class="t" text-anchor="middle" font-weight="600">PLL_BL0</text>
  <text x="355" y="167" class="ts" text-anchor="middle">hdmi_tx_slow 25.2 MHz</text>
  <text x="355" y="182" class="ts" text-anchor="middle">hdmi_tx_fast 126 MHz（相移 90°）</text>

  <rect x="480" y="128" width="210" height="62" class="b"/>
  <text x="585" y="150" class="t" text-anchor="middle" font-weight="600">PLL_TL0</text>
  <text x="585" y="170" class="ts" text-anchor="middle">core_clk 100 MHz</text>

  <rect x="710" y="128" width="230" height="62" class="b"/>
  <text x="825" y="150" class="t" text-anchor="middle" font-weight="600">PLL_TR0</text>
  <text x="825" y="167" class="ts" text-anchor="middle">sdram / rx_cal / tx_cal /</text>
  <text x="825" y="182" class="ts" text-anchor="middle">tx_cal_90edge 各 400 MHz</text>

  <rect x="40" y="176" width="135" height="52" class="bx"/>
  <text x="107" y="196" class="ts" text-anchor="middle">27 MHz 晶振（H2）</text>
  <text x="107" y="217" class="ts" text-anchor="middle">25 MHz 晶振（J2）</text>

  <path d="M175,192 H228 V157 H250" class="clk" marker-end="url(#ac)"/>
  <text x="181" y="186" font-size="9.5" fill="#b45309">clk_27m</text>
  <path d="M175,213 H790" class="clk"/>
  <path d="M585,213 V190" class="clk" marker-end="url(#ac)"/>
  <path d="M790,213 V190" class="clk" marker-end="url(#ac)"/>
  <text x="300" y="207" font-size="9.5" fill="#b45309">clk_25m</text>

  <rect x="40" y="245" width="135" height="50" class="bx"/>
  <text x="107" y="266" class="t" text-anchor="middle">主机</text>
  <text x="107" y="284" class="ts" text-anchor="middle">Efinity / OpenOCD / 串口</text>
  <path d="M107,295 V315" class="io" marker-end="url(#a)"/>
  <text x="112" y="309" class="ts">USB</text>

