  <text x="625" y="748" font-size="9" fill="#115e59" text-anchor="middle">hdmi_tx_slow 25.2 MHz</text>

  <rect x="230" y="762" width="145" height="48" class="bi"/>
  <text x="302" y="782" class="t" text-anchor="middle">color_bar_rgb</text>
