  <text x="296" y="350" class="t" text-anchor="middle">VexRiscv 单核</text>
  <text x="296" y="367" class="ts" text-anchor="middle">I$ 4KB / D$ 4KB</text>
  <text x="296" y="382" class="ts" text-anchor="middle">无 FPU</text>

  <rect x="374" y="328" width="114" height="62" class="bi"/>
  <text x="431" y="350" class="t" text-anchor="middle">片上 RAM 4KB</text>
  <text x="431" y="367" class="ts" text-anchor="middle">bootloader</text>
  <text x="431" y="382" class="ts" text-anchor="middle">512KB 版</text>

  <rect x="230" y="400" width="258" height="28" class="bi"/>
  <text x="359" y="419" class="t" text-anchor="middle">SoC 内部互连</text>

  <rect x="230" y="437" width="92" height="30" class="bi"/>
  <text x="276" y="456" class="t" text-anchor="middle">UART0</text>
  <rect x="230" y="475" width="92" height="30" class="bi"/>
  <text x="276" y="494" class="t" text-anchor="middle">SPI0</text>
