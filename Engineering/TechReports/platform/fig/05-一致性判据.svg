<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .b  { fill:#ffffff; stroke:#334155; stroke-width:1.3 }
      .bi { fill:#f8fafc; stroke:#64748b; stroke-width:1 }
      .bx { fill:#eef2f7; stroke:#64748b; stroke-width:1.2 }
      .bo { fill:#fffbeb; stroke:#b45309; stroke-width:1.3 }
      .bg { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.1; stroke-dasharray:5 4 }
      .tt { font-size:13px; font-weight:600; fill:#0f172a }
      .t  { font-size:11.5px; fill:#0f172a }
      .ts { font-size:9.5px; fill:#475569 }
      .tg { font-size:9.5px; fill:#94a3b8 }
      .axi { stroke:#1d4ed8; stroke-width:2.4; fill:none }
      .bmb { stroke:#334155; stroke-width:1.7; fill:none }
      .obs { stroke:#b45309; stroke-width:1.5; fill:none; stroke-dasharray:5 3 }
      .un  { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
      .f0 { fill:#ffffff; stroke:#334155; stroke-width:1 }
      .f1 { fill:#e2e8f0; stroke:#334155; stroke-width:1 }
      .f2 { fill:#cbd5e1; stroke:#334155; stroke-width:1 }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0f172a">缓存一致性判据的组成：三个角色与它们共享的地址</text>
  <text x="40" y="60" font-size="12" fill="#64748b">2026-09-17 的比特流，与第 03 章相同，本章没有改硬件。实例名取自 rtl/top/gfx2d_top.v。</text>

  <!-- 图例 -->
  <rect x="880" y="82" width="320" height="104" class="bi"/>
  <text x="896" y="102" class="t" font-weight="600">图例</text>
  <line x1="896" y1="120" x2="948" y2="120" class="axi" marker-end="url(#ab)"/>
  <text x="958" y="124" class="ts">AXI4：探针主机发起的外部写入</text>
  <line x1="896" y1="142" x2="948" y2="142" class="bmb" marker-end="url(#a)"/>
  <text x="958" y="146" class="ts">BMB / APB：CPU 访存与探针配置</text>
  <line x1="896" y1="164" x2="948" y2="164" class="obs" marker-end="url(#ao)"/>
  <text x="958" y="168" class="ts">核对：判据读取并比对的两个值</text>

  <!-- CPU -->
  <rect x="40" y="100" width="250" height="318" class="b"/>
  <text x="165" y="122" class="t" text-anchor="middle" font-weight="600">system_cores_0_logic_cpu</text>
  <text x="165" y="138" class="ts" text-anchor="middle">VexRiscv RV32，100MHz</text>

  <rect x="60" y="154" width="210" height="118" class="bx"/>
  <text x="165" y="174" class="t" text-anchor="middle" font-weight="600">DataCache</text>
  <text x="165" y="191" class="ts" text-anchor="middle">1 路直接映射，4096 字节</text>
  <text x="165" y="206" class="ts" text-anchor="middle">64 行 x 每行 64 字节</text>
  <text x="165" y="221" class="ts" text-anchor="middle">行号 = 地址[11:6]</text>
  <text x="165" y="236" class="ts" text-anchor="middle">标签 = 地址[31:12]</text>
  <text x="165" y="254" class="ts" text-anchor="middle">被观测行留在这里</text>
  <text x="165" y="267" class="ts" text-anchor="middle">外部写入不改它</text>

  <rect x="60" y="288" width="210" height="116" class="bi"/>
  <text x="165" y="308" class="t" text-anchor="middle">sw/cacheCoherencyTest</text>
  <text x="165" y="325" class="ts" text-anchor="middle">第 0 步 读 a^0x2000_0000 挤出该行</text>
  <text x="165" y="340" class="ts" text-anchor="middle">第 1 步 别名写入置旧值</text>
  <text x="165" y="355" class="ts" text-anchor="middle">第 2、3 步 读一次装行并核对 armed</text>
  <text x="165" y="370" class="ts" text-anchor="middle">第 4、5 步 探针写，按组决定是否失效</text>
  <text x="165" y="385" class="ts" text-anchor="middle">第 6 步 再读一次，比对</text>
  <text x="165" y="399" class="tg" text-anchor="middle">本构型无写缓冲，不需要排空</text>

  <!-- Axi_Mux -->
  <rect x="380" y="100" width="230" height="300" class="b"/>
  <text x="495" y="122" class="t" text-anchor="middle" font-weight="600">u_axi_mux</text>
  <text x="495" y="138" class="ts" text-anchor="middle">Axi_Mux，2 个从口</text>

  <rect x="398" y="154" width="194" height="52" class="f0"/>
  <text x="495" y="174" class="t" text-anchor="middle">S0</text>
  <text x="495" y="191" class="ts" text-anchor="middle">u_soc，地址[27:0]、ID 4 位</text>

  <rect x="398" y="222" width="194" height="74" class="bo"/>
  <text x="495" y="242" class="t" text-anchor="middle" font-weight="600">S1</text>
  <text x="495" y="259" class="ts" text-anchor="middle">u_axi_probe</text>
  <text x="495" y="274" class="ts" text-anchor="middle">本实验的外部写入者</text>
  <text x="495" y="288" class="ts" text-anchor="middle">单拍一笔</text>

  <rect x="398" y="310" width="194" height="78" class="bg"/>
  <text x="495" y="330" class="t" text-anchor="middle">S1 的后续占用者</text>
  <text x="495" y="347" class="ts" text-anchor="middle">渲染引擎（尚未接入）</text>
  <text x="495" y="363" class="ts" text-anchor="middle">走同一条通路，负载不同</text>
  <text x="495" y="379" class="ts" text-anchor="middle">并发度更高，见第六节</text>

  <!-- DDR3 -->
  <rect x="700" y="180" width="150" height="140" class="b"/>
  <text x="775" y="202" class="t" text-anchor="middle" font-weight="600">u_ddr3</text>
  <text x="775" y="219" class="ts" text-anchor="middle">DDR3 控制器</text>
  <text x="775" y="234" class="ts" text-anchor="middle">AXI 地址 28 位</text>
  <text x="775" y="249" class="ts" text-anchor="middle">256MB，BURST_MODE=8</text>
  <text x="775" y="270" class="tg" text-anchor="middle">写入不通知 CPU</text>
  <text x="775" y="285" class="tg" text-anchor="middle">没有 snoop</text>
  <text x="775" y="305" class="ts" text-anchor="middle">缓存的副本靠失效同步</text>

  <!-- 连线：CPU -> Mux -->
  <line x1="290" y1="180" x2="396" y2="180" class="bmb" marker-end="url(#a)"/>
  <text x="343" y="174" class="ts" text-anchor="middle">128 位</text>

  <!-- 连线：探针写 -> Mux -->
  <line x1="290" y1="255" x2="396" y2="255" class="axi" marker-end="url(#ab)"/>
  <text x="343" y="249" class="ts" text-anchor="middle">单拍写</text>

  <!-- 连线：Mux -> DDR3 -->
  <line x1="610" y1="250" x2="696" y2="250" class="axi" marker-end="url(#ab)"/>
  <text x="653" y="244" class="ts" text-anchor="middle">128 位</text>

  <!-- 核对：CPU 读回 -->
  <path d="M 165 418 C 165 452 300 470 420 470 L 706 470 L 706 320" class="obs" marker-end="url(#ao)"/>
  <text x="470" y="462" class="ts" fill="#b45309" text-anchor="middle">第 6 步读回：读到旧值 = 缓存遮蔽成立</text>

  <!-- 地址表 -->
  <rect x="40" y="500" width="1160" height="196" class="bi"/>
  <text x="58" y="522" class="t" font-weight="600">判据用到的地址（测试区 0x0C80_0000 起，与程序、数据、栈所在的 0x0000_1000 起的几 KB 错开）</text>

  <text x="58" y="548" class="ts" font-weight="600">名称</text>
  <text x="230" y="548" class="ts" font-weight="600">地址</text>
  <text x="400" y="548" class="ts" font-weight="600">行号 [11:6]</text>
  <text x="510" y="548" class="ts" font-weight="600">标签 [31:12]</text>
  <text x="650" y="548" class="ts" font-weight="600">用途</text>

  <line x1="58" y1="556" x2="1182" y2="556" stroke="#cbd5e1" stroke-width="1"/>

  <text x="58" y="576" class="ts">A_BASE</text>
  <text x="230" y="576" class="ts">0x0C800000</text>
  <text x="400" y="576" class="ts">0</text>
  <text x="510" y="576" class="ts">0x0C800</text>
  <text x="650" y="576" class="ts">A1、A2、A3 的观测地址</text>

  <text x="58" y="598" class="ts">A_STRESS + k*0x1000</text>
  <text x="230" y="598" class="ts">0x0C801040 起，k = 1..64</text>
  <text x="400" y="598" class="ts">1（页内偏移固定）</text>
  <text x="510" y="598" class="ts">0x0C801..0x0C840</text>
  <text x="650" y="598" class="ts">A2 的压力访问，只碰行号 1</text>

  <text x="58" y="620" class="ts">B_BASE / C_BASE</text>
  <text x="230" y="620" class="ts">0x0C800080 / 0x0C8000C0</text>
  <text x="400" y="620" class="ts">2 / 3</text>
  <text x="510" y="620" class="ts">0x0C800</text>
  <text x="650" y="620" class="ts">B、C 两组各占一个行号</text>

  <text x="58" y="642" class="ts">a ^ 0x2000_0000</text>
  <text x="230" y="642" class="ts">由 a 派生</text>
  <text x="400" y="642" class="ts">与 a 相同</text>
  <text x="510" y="642" class="ts">标签不同</text>
  <text x="650" y="642" class="ts">第 0 步与 D 组：读它把同号的行换出去</text>

  <text x="58" y="664" class="ts">a ^ 0x1000_0000</text>
  <text x="230" y="664" class="ts">由 a 派生</text>
  <text x="400" y="664" class="ts">与 a 相同</text>
  <text x="510" y="664" class="ts">DDR 别名，同颗粒地址</text>
  <text x="650" y="664" class="ts">第 1 步：不经过 a 的缓存行把 DDR 置成旧值</text>

  <text x="58" y="686" class="tg">栈区 4KB 覆盖全部 64 个行号，栈顶随产物变化（-Og 版 _sp = 0x3280）；第 2 步到第 6 步之间不打印、不调深层函数。</text>
</svg>
